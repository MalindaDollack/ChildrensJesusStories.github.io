<html lang="en-CA">
<head>
<meta charset="utf-8">

<title>Sarah the Baby Sheep | 5-Page Flip Book Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6ecfb;font-family:Arial,sans-serif;color:#351344;text-align:center}.wrap{max-width:980px;margin:auto;padding:18px}h1{color:#5a1678;font-size:clamp(22px,4vw,36px);margin:6px 0}.note{font-weight:700}.book{width:min(88vw,560px);aspect-ratio:6.5/9;margin:18px auto;perspective:1800px;position:relative}.page{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);overflow:hidden;transform-origin:left center;transition:transform .35s ease}.page.turn-next{transform:rotateY(-14deg)}.page.turn-prev{transform:rotateY(14deg)}.page img{width:100%;height:100%;object-fit:contain;display:block}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button,.buy,.photo{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer}.controls button,.buy{background:#6b218a;color:#fff}.controls button:disabled{background:#a98ab5;cursor:default}.buy{text-decoration:none;display:inline-block}.photo{background:#176b27;color:#fff;display:inline-block;margin-left:10px;text-decoration:none}.status{font-weight:900;color:#5a1678;min-width:110px}@media(max-width:600px){.wrap{padding:10px}.controls button{padding:10px 14px}.photo{display:block;margin:10px auto 0;width:max-content}}
</style>
</head>
<body>
<div class="wrap">
<h1>Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story</h1>
<p class="note">5-Page Flip Book E-Book Preview — click Next or swipe left to turn the pages.</p>
<div class="book" id="book"><div class="page" id="page"><img id="pageImage" src="fb1.png" alt="Preview page 1"></div></div>
<div class="controls"><button id="prev">◀ Previous</button><span class="status" id="status">Page 1 of 5</span><button id="next">Next ▶</button></div>
<a class="buy" href="mailto:dollackj316@gmail.com?subject=Order%20inquiry%3A%20Flip%20Book%20E-Book%20Edition%20Link&body=Hello%20Malinda%2C%0A%0AI%20would%20like%20the%20Flip%20Book%20E-Book%20Edition.%0A%0AMy%20name%3A%0AMy%20e-mail%20address%3A%0A%0APlease%20send%20me%20the%20e-Transfer%20instructions.%0A">Buy Now !</a>
<a class="photo" href="index.html#staples-book-card">Photo Book Edition Available Now !</a>
</div>
<script>
const pages=['fb1.png','fb2.png','fb3.png','fb4.png','fb5.png'];
let page=0;const img=document.getElementById('pageImage'),sheet=document.getElementById('page'),status=document.getElementById('status'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
function preload(i){if(i>=0&&i<pages.length){const p=new Image();p.src=pages[i]}}
function render(dir){sheet.className='page '+(dir>0?'turn-next':dir<0?'turn-prev':'');setTimeout(()=>{img.src=pages[page];img.alt='Preview page '+(page+1);status.textContent='Page '+(page+1)+' of '+pages.length;prevBtn.disabled=page===0;nextBtn.disabled=page===pages.length-1;sheet.className='page';preload(page+1)},120)}
function next(){if(page<pages.length-1){page++;render(1)}}function prev(){if(page>0){page--;render(-1)}}
nextBtn.onclick=next;prevBtn.onclick=prev;let x=0;const b=document.getElementById('book');b.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});b.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()},{passive:true});b.addEventListener('click',e=>{if(e.clientX>b.getBoundingClientRect().left+b.offsetWidth/2)next();else prev()});render(0);
</script>
</body>
</html>
