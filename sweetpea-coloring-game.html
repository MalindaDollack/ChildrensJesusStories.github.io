<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#4b146f">
<title>Jesus Makes Sweet-Pea Fly! | Malinda's Story Garden</title>
<style>
*{box-sizing:border-box}
html,body{color-scheme:only light;background:#fff}
body{margin:0;font-family:Arial,sans-serif;color:#30143f}
.page{width:94%;max-width:780px;margin:0 auto;padding:18px 0 40px;text-align:center}
.back{display:inline-block;margin-bottom:14px;padding:11px 18px;border-radius:999px;background:#5b197d;color:#fff;text-decoration:none;font-weight:bold}
.game{border:4px solid #5b197d;border-radius:24px;padding:16px;background:#fff;box-shadow:0 10px 24px rgba(75,20,111,.18)}
h1{margin:4px 0 8px;color:#4b146f;font-size:30px}
.instructions{font-size:18px;font-weight:bold;color:#4b146f}
.reference{width:90%;max-width:420px;margin:14px auto}
.reference img{display:block;width:100%;height:auto;border:3px solid #ead5f5;border-radius:16px;background:#fff}
.stage{position:relative;width:94%;max-width:620px;margin:12px auto 0}
#sweetpeaBase{display:block;width:100%;height:auto;border:3px solid #5b197d;border-radius:16px;background:#fff;filter:grayscale(1) brightness(1.25) contrast(1.05)}
#sweetpeaCanvas{position:absolute;left:0;top:0;width:100%;height:100%;z-index:3;border-radius:16px;cursor:crosshair;touch-action:none;background:transparent}
.wing{display:none;position:absolute;top:40%;width:31%;height:24%;background:#d2a06f;border:3px solid #6f4a32;border-radius:65% 35% 65% 35%;z-index:1}
.left-wing{left:-10%;transform:rotate(20deg)}
.right-wing{right:-10%;transform:scaleX(-1) rotate(20deg)}
.stage.flying .wing{display:block}
.stage.flying #sweetpeaBase,.stage.flying #sweetpeaCanvas{animation:bob .55s ease-in-out infinite alternate}
.stage.flying .left-wing{animation:leftFlap .28s ease-in-out infinite alternate}
.stage.flying .right-wing{animation:rightFlap .28s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes leftFlap{from{transform:rotate(32deg)}to{transform:rotate(-25deg)}}
@keyframes rightFlap{from{transform:scaleX(-1) rotate(32deg)}to{transform:scaleX(-1) rotate(-25deg)}}
.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:16px auto}
.palette button{width:42px;height:42px;border-radius:50%;border:3px solid #5b197d;cursor:pointer}
.palette button.selected{outline:4px solid #ffd94e}
#jesusHeart{border:3px solid #5b197d;border-radius:18px;background:#fff;color:#5b197d;font-weight:bold;font-size:18px;padding:12px 20px;cursor:pointer}
#clearGame{border:0;border-radius:999px;background:#5b197d;color:#fff;font-weight:bold;font-size:16px;padding:11px 18px;margin-left:8px;cursor:pointer}
#message{min-height:28px;font-size:18px;font-weight:bold;color:#a00078}
.note{font-weight:bold;color:#4b146f}
@media(max-width:560px){h1{font-size:24px}.instructions{font-size:16px}.palette button{width:36px;height:36px}}
</style>
</head>
<body>
<div class="page">
<a class="back" href="index.html#about">← Back to Malinda's Story Garden</a>
<div class="game">
<h1>Jesus Makes Sweet-Pea Fly !</h1>
<p class="instructions">Color Sweet-Pea and Fill her heart with Jesus and she will fly!</p>

<div class="reference">
<h2>Sweet-Pea's Colors</h2>
<img src="sweetpea-new.png?v=3" alt="Colored Sweet-Pea the Baby Sparrow reference picture">
</div>

<h2>Color Sweet-Pea</h2>
<div class="stage" id="stage">
<span class="wing left-wing" aria-hidden="true"></span>
<span class="wing right-wing" aria-hidden="true"></span>
<img id="sweetpeaBase" src="sweetpea-new.png?v=3" alt="Sweet-Pea coloring picture">
<canvas id="sweetpeaCanvas" aria-label="Color Sweet-Pea here"></canvas>
</div>

<div class="palette" id="palette">
<button type="button" data-color="#6f4a32" style="background:#6f4a32" aria-label="Brown"></button>
<button type="button" data-color="#c99569" style="background:#c99569" aria-label="Tan"></button>
<button type="button" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
<button type="button" data-color="#ff4fa3" style="background:#ff4fa3" aria-label="Bright Pink"></button>
<button type="button" data-color="#ffc4df" style="background:#ffc4df" aria-label="Light Pink"></button>
<button type="button" data-color="#4aa8ff" style="background:#4aa8ff" aria-label="Blue"></button>
<button type="button" data-color="#5b197d" style="background:#5b197d" aria-label="Dark Purple"></button>
<button type="button" data-color="#f4ce48" style="background:#f4ce48" aria-label="Gold"></button>
<button type="button" data-color="#ff0000" style="background:#ff0000" aria-label="Bright Red"></button>
</div>

<p class="note">Choose a color and color Sweet-Pea. Then choose Bright Red and click the Jesus heart.</p>
<button type="button" id="jesusHeart">♥ Jesus !</button>
<button type="button" id="clearGame">Start Again</button>
<p id="message" aria-live="polite"></p>
</div>
</div>

<script>
(function(){
  var canvas=document.getElementById('sweetpeaCanvas');
  var ctx=canvas.getContext && canvas.getContext('2d');
  var base=document.getElementById('sweetpeaBase');
  var stage=document.getElementById('stage');
  var palette=document.getElementById('palette');
  var heart=document.getElementById('jesusHeart');
  var clear=document.getElementById('clearGame');
  var message=document.getElementById('message');
  var selected='#ff4fa3';
  var drawing=false;
  var lastX=0,lastY=0;

  if(!ctx){
    message.innerHTML='The coloring tools are not supported by this browser, but Sweet-Pea is still shown above.';
    return;
  }

  function resizeCanvas(){
    var w=base.naturalWidth || base.width || 600;
    var h=base.naturalHeight || base.height || 600;
    canvas.width=w;
    canvas.height=h;
  }

  function chooseButton(btn){
    var buttons=palette.getElementsByTagName('button');
    var i;
    for(i=0;i<buttons.length;i++){buttons[i].className='';}
    btn.className='selected';
    selected=btn.getAttribute('data-color');
  }

  palette.onclick=function(e){
    e=e||window.event;
    var t=e.target||e.srcElement;
    if(t && t.tagName && t.tagName.toLowerCase()==='button'){chooseButton(t);}
  };

  function pos(clientX,clientY){
    var r=canvas.getBoundingClientRect();
    return {
      x:(clientX-r.left)*canvas.width/r.width,
      y:(clientY-r.top)*canvas.height/r.height
    };
  }

  function dot(x,y){
    ctx.save();
    ctx.globalAlpha=.46;
    ctx.fillStyle=selected;
    ctx.beginPath();
    ctx.arc(x,y,Math.max(16,canvas.width/34),0,Math.PI*2,false);
    ctx.fill();
    ctx.restore();
  }

  function line(x1,y1,x2,y2){
    ctx.save();
    ctx.globalAlpha=.46;
    ctx.strokeStyle=selected;
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.lineWidth=Math.max(30,canvas.width/17);
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x2,y2);
    ctx.stroke();
    ctx.restore();
  }

  canvas.onmousedown=function(e){
    e=e||window.event;
    var p=pos(e.clientX,e.clientY);
    drawing=true;lastX=p.x;lastY=p.y;dot(p.x,p.y);
    return false;
  };
  canvas.onmousemove=function(e){
    if(!drawing)return false;
    e=e||window.event;
    var p=pos(e.clientX,e.clientY);
    line(lastX,lastY,p.x,p.y);
    lastX=p.x;lastY=p.y;
    return false;
  };
  canvas.onmouseup=function(){drawing=false;return false;};
  canvas.onmouseleave=function(){drawing=false;};

  canvas.ontouchstart=function(e){
    if(!e.touches||!e.touches.length)return;
    var t=e.touches[0],p=pos(t.clientX,t.clientY);
    drawing=true;lastX=p.x;lastY=p.y;dot(p.x,p.y);
    if(e.preventDefault)e.preventDefault();
  };
  canvas.ontouchmove=function(e){
    if(!drawing||!e.touches||!e.touches.length)return;
    var t=e.touches[0],p=pos(t.clientX,t.clientY);
    line(lastX,lastY,p.x,p.y);
    lastX=p.x;lastY=p.y;
    if(e.preventDefault)e.preventDefault();
  };
  canvas.ontouchend=function(e){drawing=false;if(e&&e.preventDefault)e.preventDefault();};

  heart.onclick=function(){
    heart.style.background=selected;
    heart.style.color=(selected.toLowerCase()==='#ffffff')?'#5b197d':'#ffffff';
    if(selected.toLowerCase()==='#ff0000'){
      stage.className='stage flying';
      message.innerHTML='JESUS LOVES YOU ! Sweet-Pea is flying !';
    }else{
      stage.className='stage';
      message.innerHTML='Choose Bright Red for the Jesus heart.';
    }
  };

  clear.onclick=function(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stage.className='stage';
    heart.style.background='#ffffff';
    heart.style.color='#5b197d';
    message.innerHTML='';
  };

  base.onload=resizeCanvas;
  if(base.complete){resizeCanvas();}
  var first=palette.getElementsByTagName('button')[3];
  if(first){chooseButton(first);}
})();
</script>
</body>
</html>
