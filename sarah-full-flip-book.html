<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow">
<title>Sarah the Baby Sheep | Full 24-Page Flip Book</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6ecfb;font-family:Arial,sans-serif;color:#351344;text-align:center}.wrap{max-width:980px;margin:auto;padding:18px}h1{color:#5a1678;font-size:clamp(22px,4vw,36px);margin:6px 0}.note{font-weight:700}.book{width:min(88vw,560px);aspect-ratio:6.5/9;margin:18px auto;perspective:1800px;position:relative}.page{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);overflow:hidden;transform-origin:left center;transition:transform .35s ease}.page.turn-next{transform:rotateY(-14deg)}.page.turn-prev{transform:rotateY(14deg)}.page img{width:100%;height:100%;object-fit:contain;display:block}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer;background:#6b218a;color:#fff}.controls button:disabled{background:#a98ab5;cursor:default}.status{font-weight:900;color:#5a1678;min-width:130px}@media(max-width:600px){.wrap{padding:10px}.controls button{padding:10px 14px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story</h1>
<p class="note">Full 24-Page Flip Book E-Book — click Next or swipe left to turn the pages.</p>
<div class="book" id="book"><div class="page" id="page"><img id="pageImage" src="fb1.png" alt="Full flip book page 1"></div></div>
<div class="controls"><button id="prev">◀ Previous</button><span class="status" id="status">Page 1 of 24</span><button id="next">Next ▶</button></div>
</div>
<script>
const pages=Array.from({length:24},(_,i)=>'fb'+(i+1)+'.png');
let page=0;const img=document.getElementById('pageImage'),sheet=document.getElementById('page'),status=document.getElementById('status'),prevBtn=document.getElementById('prev'),nextBtn=document.getElementById('next');
function preload(i){if(i>=0&&i<pages.length){const p=new Image();p.src=pages[i]}}
function render(dir){sheet.className='page '+(dir>0?'turn-next':dir<0?'turn-prev':'');setTimeout(()=>{img.src=pages[page];img.alt='Full flip book page '+(page+1);status.textContent='Page '+(page+1)+' of '+pages.length;prevBtn.disabled=page===0;nextBtn.disabled=page===pages.length-1;sheet.className='page';preload(page+1)},120)}
function next(){if(page<pages.length-1){page++;render(1)}}function prev(){if(page>0){page--;render(-1)}}
nextBtn.onclick=next;prevBtn.onclick=prev;let x=0;const b=document.getElementById('book');b.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});b.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()},{passive:true});b.addEventListener('click',e=>{if(e.clientX>b.getBoundingClientRect().left+b.offsetWidth/2)next();else prev()});render(0);
</script>
</body>
</html>
