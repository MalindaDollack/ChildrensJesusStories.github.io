<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="robots" content="noindex,nofollow">
<title>Sarah the Baby Sheep | Full 24-Page Flip Book</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6ecfb;font-family:Arial,sans-serif;color:#351344;text-align:center}.wrap{max-width:820px;margin:auto;padding:16px}h1{color:#5a1678;font-size:clamp(22px,4vw,34px);margin:6px 0}.note{font-weight:700}.book{width:min(88vw,560px);aspect-ratio:6.5/9;margin:18px auto;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);overflow:hidden}.book img{width:100%;height:100%;object-fit:contain;display:block}.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:14px 0}.controls button{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer;background:#6b218a;color:#fff}.controls button:disabled{background:#a98ab5;cursor:default}.status{font-weight:900;color:#5a1678;min-width:130px}.pages{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px auto;max-width:650px}.pages button{min-width:35px;height:35px;border:2px solid #6b218a;border-radius:999px;background:#fff;color:#6b218a;font-weight:900;cursor:pointer}.pages button.active{background:#6b218a;color:#fff}@media(max-width:600px){.wrap{padding:10px}.controls button{padding:10px 14px}.pages button{min-width:31px;height:31px;font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story</h1>
<p class="note">Full 24-Page Flip Book E-Book — use Next, Previous, or a page number.</p>
<div class="book"><img id="pageImage" src="fb1.png?v=24" alt="Full flip book page 1"></div>
<div class="controls"><button id="prev" type="button">◀ Previous</button><span class="status" id="status">Page 1 of 24</span><button id="next" type="button">Next ▶</button></div>
<div class="pages" id="pages"></div>
</div>
<script>
var currentPage=1;
var totalPages=24;
var image=document.getElementById('pageImage');
var statusText=document.getElementById('status');
var prev=document.getElementById('prev');
var next=document.getElementById('next');
var pages=document.getElementById('pages');
function imageUrl(n){return 'fb'+n+'.png?v=24';}
function goToPage(n){
 if(n<1||n>totalPages){return;}
 currentPage=n;
 image.src=imageUrl(n);
 image.alt='Full flip book page '+n;
 statusText.innerHTML='Page '+n+' of '+totalPages;
 prev.disabled=(n===1);
 next.disabled=(n===totalPages);
 var buttons=pages.getElementsByTagName('button');
 for(var i=0;i<buttons.length;i++){buttons[i].className=((i+1)===n?'active':'');}
}
for(var i=1;i<=totalPages;i++){
 (function(n){var b=document.createElement('button');b.type='button';b.innerHTML=n;b.onclick=function(){goToPage(n);};pages.appendChild(b);})(i);
}
prev.onclick=function(){goToPage(currentPage-1);};
next.onclick=function(){goToPage(currentPage+1);};
goToPage(1);
</script>
</body>
</html>
