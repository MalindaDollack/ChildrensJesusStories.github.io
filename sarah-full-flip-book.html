<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story</title><style>*{box-sizing:border-box}body{margin:0;background:#f6ecfb;font-family:Arial,sans-serif;color:#351344;text-align:center}.wrap{max-width:980px;margin:auto;padding:18px}h1{color:#5a1678;font-size:clamp(22px,4vw,36px);margin:6px 0}.note{font-weight:700}.book{width:min(88vw,560px);aspect-ratio:6.5/9;margin:18px auto;perspective:1800px;position:relative}.sheet{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);transform-origin:left center;transition:transform .7s ease,opacity .15s .55s;backface-visibility:hidden;overflow:hidden}.sheet img{width:100%;height:100%;object-fit:contain;display:block}.sheet.turned{transform:rotateY(-180deg);opacity:0;pointer-events:none}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer;background:#6b218a;color:#fff}.status{font-weight:900;color:#5a1678;min-width:130px}@media(max-width:600px){.wrap{padding:10px}.controls button{padding:10px 14px}}</style></head><body><div class="wrap"><h1>Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story</h1><p class="note">Full 24-Page Flip Book E-Book — click Next or swipe left to turn the pages.</p><div class="book" id="book"></div><div class="controls"><button id="prev">◀ Previous</button><span class="status" id="status"></span><button id="next">Next ▶</button></div></div><script>const pages=[['mastercover.png','Cover'],['mastercopyright.png','Copyright page'],['masterdedication.png','Dedication page'],['masterpage1.png','Story page 1'],['masterpage2.png','Story page 2'],['masterpage3.png','Story page 3'],['masterpage4.png','Story page 4'],['masterpage5.png','Story page 5'],['masterpage6.png','Story page 6'],['masterpage7.png','Story page 7'],['masterpage8.png','Story page 8'],['masterpage9.png','Story page 9'],['masterpage10.png','Story page 10'],['masterpage11.png','Story page 11'],['masterpage12.png','Story page 12'],['masterpage13.png','Story page 13'],['masterpage14.png','Story page 14'],['masterkidsmanger.png','The Birth of Jesus illustrated scripture title page'],['masterscripture.png','The Birth of Jesus Luke 1-20 NIV scripture page'],['Sarah%20Animal%20Suduko.png','Sarah Sudoku'],['sarah-find-a-word-instructions.png','Find-a-Word instructions and word list'],['Sarah%20Find%20A%20Word.png','Sarah Find-a-Word puzzle'],['game-win-jesus-loves-you.png','Jesus Loves You'],['masterback.png','Back cover']];const book=document.getElementById('book');pages.forEach((p,i)=>{const s=document.createElement('div');s.className='sheet';s.dataset.page=i+1;s.style.zIndex=pages.length-i;const img=document.createElement('img');img.src=p[0];img.alt=p[1];s.appendChild(img);book.appendChild(s)});const sheets=[...document.querySelectorAll('.sheet')],status=document.getElementById('status');let page=1;function render(){sheets.forEach((s,i)=>s.classList.toggle('turned',i<page-1));status.textContent='Page '+page+' of '+pages.length}function next(){if(page<pages.length){page++;render()}}function prev(){if(page>1){page--;render()}}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;let x=0;book.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});book.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()},{passive:true});book.addEventListener('click',e=>{if(e.clientX>book.getBoundingClientRect().left+book.offsetWidth/2)next();else prev()});render();</script></body></html>
