name: Apply PID11 and PID14 photo updates

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-pid11-pid14.yml'

permissions:
  contents: write

jobs:
  patch-products:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update PID11 and PID14 only
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          note = "Please note this Photo looks much better in real life. I am using very old equipment to produce these ads the blurriness and sometimes lack of definition are caused by my camera. I wanted to give you the most accurate representation of the Children's Bible Story Photo Book Edition, Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. JESUS LOVES YOU !"
          mockup = "I have included a new mock-up of what the new books will look like as after my 1st printing I realized the pictures needed changes. The new books will have the borders on all photo pages as indicated."
          photos = [
              'staples new alone.jpg',
              'staples new horizontal.jpg',
              'staples new vertical.jpg',
              'staples new blank and dedication.jpg',
              'staples new frog and snuggled.jpg',
              'staples envelope.jpg',
              'staples original.jpg',
              'staples original blank and dedication.jpg',
              'staples original frog and snuggled.jpg',
          ]

          def photo_gallery():
              pieces = ['<!-- PID-STAPLES-PHOTOS-START -->', '<div class="pid-staples-photo-gallery" style="display:grid;grid-template-columns:1fr;gap:18px;margin:18px 0;">']
              for number, filename in enumerate(photos, 1):
                  caption = filename[:-4]
                  pieces.append(
                      '<figure style="margin:0;text-align:center;">'
                      f'<img loading="lazy" decoding="async" src="{html.escape(filename, quote=True)}" alt="{html.escape(caption, quote=True)}" style="width:100%;height:auto;object-fit:contain;background:#fff;border-radius:14px;">'
                      f'<figcaption style="margin-top:6px;font-weight:800;color:#4b146f;">{number}. {html.escape(caption)}</figcaption>'
                      '</figure>'
                  )
              pieces.extend(['</div>', '<!-- PID-STAPLES-PHOTOS-END -->'])
              return '\n'.join(pieces)

          def patch_product(source, pid, cover):
              article_pattern = re.compile(
                  rf'(<article class="store-card staples-landscape" id="store-{re.escape(pid)}">)(.*?)(</article>)',
                  re.S,
              )
              match = article_pattern.search(source)
              if not match:
                  raise RuntimeError(f'{pid} product block not found')

              block = match.group(0)

              # Make reruns safe by removing this patch's prior note/gallery if present.
              block = re.sub(r'<!-- PID-STAPLES-NOTE-START -->.*?<!-- PID-STAPLES-NOTE-END -->\s*', '', block, flags=re.S)
              block = re.sub(r'<!-- PID-STAPLES-PHOTOS-START -->.*?<!-- PID-STAPLES-PHOTOS-END -->\s*', '', block, flags=re.S)

              cover_html = (
                  '<div class="product-gallery collapsible-gallery">'
                  f'<img loading="lazy" decoding="async" src="{html.escape(cover, quote=True)}" alt="{pid} Staples Produced Soft Cover Photo Book">'
                  '</div>'
              )
              block, count = re.subn(
                  r'<div class="product-gallery collapsible-gallery">.*?</div>\s*(?=<h3>)',
                  cover_html + '\n',
                  block,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise RuntimeError(f'{pid} old picture gallery was not replaced exactly once')

              note_html = (
                  '<!-- PID-STAPLES-NOTE-START -->\n'
                  f'<p><strong>{html.escape(note)}</strong></p>\n'
                  f'<p>{html.escape(mockup)}</p>\n'
                  '<!-- PID-STAPLES-NOTE-END -->'
              )
              details_marker = '<div class="store-details" hidden>'
              if details_marker not in block:
                  raise RuntimeError(f'{pid} description container not found')
              block = block.replace(details_marker, details_marker + '\n' + note_html, 1)

              order_marker = '<div class="store-order">'
              if order_marker not in block:
                  raise RuntimeError(f'{pid} Buy Now block not found')
              block = block.replace(order_marker, photo_gallery() + '\n' + order_marker, 1)

              return source[:match.start()] + block + source[match.end():]

          text = patch_product(text, 'PID11', 'new staples book shipped.jpg')
          text = patch_product(text, 'PID14', 'new staples book picked up at local staples.jpg')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit website change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Update PID11 and PID14 product photos"
            git push
          fi
