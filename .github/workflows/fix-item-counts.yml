name: Fix Item Counts

on:
  push:
    paths:
      - '.github/workflows/fix-item-counts.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested item count fixes only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_count = '21 Items Available'
          if s.count(old_count) != 1:
              raise SystemExit(f'Expected exactly 1 occurrence of {old_count!r}, found {s.count(old_count)}')
          s = s.replace(old_count, '23 Items Available', 1)

          old_digital = '<p class="store-intro"><strong>No Refunds on Digital Items</strong></p>'
          new_digital = '<p class="store-intro"><strong>Each Month a new set of 5 Digital Items will be Available.</strong><br><strong>No Refunds on Digital Items</strong></p>'
          if s.count(old_digital) != 1:
              raise SystemExit(f'Expected exactly 1 Digital Items intro, found {s.count(old_digital)}')
          s = s.replace(old_digital, new_digital, 1)

          # Confirm the existing Physical Items monthly count remains unchanged.
          physical = 'Each Month a new set of 18 Physical Items will be Available.'
          if s.count(physical) != 1:
              raise SystemExit(f'Physical 18-item wording unexpectedly changed; found {s.count(physical)} occurrences')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit requested item count fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct available item and digital monthly counts"
          git push
