name: One-time direct PID4 PID5 PID6 fix

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-pid456-direct.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PID4 PID5 PID6 directly in index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          note = ('Please note these Stickers looks much better in real life. I am using very old equipment to produce these ads the blurriness and sometimes lack of definition are caused by my camera. I wanted to give you the most accurate representation of these Stickers. I have included photos with rulers. The Stickers are all of Sarah the Baby Sheep: Jesus Loves You ! from the Children\'s Bible Story Book, Sarah the Baby Sheep: My Shepherd, Jesus\'s Birth. The Christmas Story. All Avery Paper Stickers are reusable. I have tried it and you can "carefully" remove them and place them again somewhere else. JESUS LOVES YOU !')

          items = {
              'PID4': {
                  'main': 'stickers 20 small alone.jpg',
                  'main_alt': 'stickers 20 small alone',
                  'details': [
                      ('stickers 20 small horizontal.jpg', 'stickers 20 small horizontal'),
                      ('stickers 20 small vertical.jpg', 'stickers 20 small vertical'),
                      ('stickers 20 small envelope.jpg', 'stickers 20 small envelope'),
                  ],
              },
              'PID5': {
                  'main': 'stickers 4 medium alone.jpg',
                  'main_alt': 'stickers 4 medium alone',
                  'details': [
                      ('stickers 4 medium horizontal.jpg', 'stickers 4 medium horizontal'),
                      ('stickers 4 medium vertical.jpg', 'stickers 4 medium vertical'),
                      ('stickers 4 medium envelope.jpg', 'stickers 4 medium envelope'),
                  ],
              },
              'PID6': {
                  'main': 'sticker lg alone.jpg',
                  'main_alt': 'sticker lg alone',
                  'details': [
                      ('sticker lg horizontal.jpg', 'sticker lg horizontal'),
                      ('sticker lg vertical.jpg', 'sticker lg vertical'),
                      ('sticker lg mailing.jpg', 'sticker lg mailing'),
                  ],
              },
          }

          def gallery_html(details, code):
              figures = []
              for filename, label in details:
                  figures.append(
                      f'<figure style="margin:0;text-align:center;">'
                      f'<img loading="lazy" decoding="async" src="{filename}?v=20261002b" alt="{label}" style="display:block;width:100%;height:auto!important;aspect-ratio:auto!important;object-fit:contain;margin:0 auto;">'
                      f'<figcaption style="margin-top:6px;color:#4b146f;font-weight:800;line-height:1.25;">{label}</figcaption>'
                      f'</figure>'
                  )
              return (
                  f'<p class="pid-sticker-photo-note"><strong>{note}</strong></p>\n'
                  f'<div class="pid-sticker-photo-gallery" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0 22px;">\n'
                  + '\n'.join(figures) + '\n</div>\n'
              )

          for code, data in items.items():
              pattern = re.compile(rf'(<article class="store-card" id="store-{code}">)(.*?)(</article>)', re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Could not find store-{code}')
              body = match.group(2)

              body = re.sub(
                  r'\n?<img\b[^>]*>\n?',
                  f'\n<img loading="lazy" decoding="async" src="{data["main"]}?v=20261002b" alt="{data["main_alt"]}">\n',
                  body,
                  count=1,
              )

              body = re.sub(r'\n?<p class="pid-sticker-photo-note">.*?</p>\n?', '\n', body, flags=re.S)
              body = re.sub(r'\n?<div class="pid-sticker-photo-gallery".*?</div>\n?', '\n', body, flags=re.S)

              marker = '<div class="store-details" hidden>\n'
              if marker not in body:
                  raise SystemExit(f'Could not find description start for {code}')
              body = body.replace(marker, marker + gallery_html(data['details'], code), 1)
              replacement = match.group(1) + body + match.group(3)
              text = text[:match.start()] + replacement + text[match.end():]

          path.write_text(text, encoding='utf-8')

      - name: Verify direct changes
        shell: bash
        run: |
          grep -q 'stickers 20 small alone.jpg?v=20261002b' index.html
          grep -q 'stickers 4 medium alone.jpg?v=20261002b' index.html
          grep -q 'sticker lg alone.jpg?v=20261002b' index.html
          grep -q 'stickers 20 small envelope.jpg?v=20261002b' index.html
          grep -q 'stickers 4 medium envelope.jpg?v=20261002b' index.html
          grep -q 'sticker lg mailing.jpg?v=20261002b' index.html
          grep -q 'All Avery Paper Stickers are reusable' index.html

      - name: Commit direct HTML fix
        shell: bash
        run: |
          git config user.name "Malinda Dollack"
          git config user.email "dollackj316@gmail.com"
          git add index.html
          git commit -m "Fix PID4 PID5 PID6 pictures directly in index" || exit 0
          git push
