name: One-time hero text fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/one-time-hero-text-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace exact hero sentence in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<p>Joyful, colourful Bible Adventures that help children discover courage, kindness, obedience, hope, and the love of Jesus.</p>'
          new = '<p>Joyful, Colourful Bible Adventure Books for Children that help discover their Courage, Kindness, Obedience, Hope, and Love for Jesus.</p>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one matching hero sentence, found {count}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit permanent source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Update homepage hero description"
          git push origin HEAD:main

# Exact current homepage wording targeted.
