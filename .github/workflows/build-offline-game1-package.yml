name: Build Offline Matching Game Package

on:
  push:
    branches:
      - offline-game1-package-20260926

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: python -m pip install --upgrade pillow reportlab

      - name: Build package
        run: python tools/build_offline_game1.py

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Malindas_Story_Garden_Matching_Game_OFFLINE_PACKAGE
          path: dist/Malindas_Story_Garden_Matching_Game_OFFLINE_PACKAGE.zip
          if-no-files-found: error
          retention-days: 7
