name: Build Offline Matching Game Package

on:
  push:
    branches:
      - offline-game1-package-20260926

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF/image tools
        run: python -m pip install --upgrade pillow reportlab

      - name: Build offline package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import letter
          from reportlab.lib.utils import ImageReader
          from reportlab.lib.colors import HexColor
          import shutil, zipfile, html

          repo = Path.cwd()
          dist = repo / "dist"
          pkg = dist / "Malindas_Story_Garden_Matching_Game_OFFLINE"
          assets = pkg / "assets"
          pdfs = pkg / "printable_pdfs"
          for p in (dist, pkg, assets, pdfs):
              p.mkdir(parents=True, exist_ok=True)

          image_sources = [
              ("Sarah", repo/"web-images"/"sarah book cover for library.webp", "sarah.png"),
              ("Joy", repo/"web-images"/"joy-new.webp", "joy.png"),
              ("Wally", repo/"web-images"/"wally-new.webp", "wally.png"),
              ("Levi", repo/"web-images"/"levi-new.webp", "levi.png"),
              ("Freddy", repo/"web-images"/"freddy-new.webp", "freddy.png"),
              ("Patsy", repo/"web-images"/"patsy-new.webp", "patsy.png"),
              ("Davy", repo/"web-images"/"davy-new.webp", "davy.png"),
              ("Larry", repo/"web-images"/"larry-new.webp", "larry.png"),
              ("Francesco", repo/"web-images"/"francesco-new.webp", "francesco.png"),
              ("Sweet-Pea", repo/"web-images"/"sweetpea-new.webp", "sweetpea.png"),
              ("Willy", repo/"web-images"/"willy-new.webp", "willy.png"),
              ("Barry", repo/"web-images"/"barry-new.webp", "barry.png"),
              ("JESUS LOVES YOU - Win Picture", repo/"web-images"/"game-win-jesus-loves-you.webp", "jesus-loves-you-win.png"),
          ]

          for label, src, out_name in image_sources:
              if not src.exists():
                  raise FileNotFoundError(src)
              im = Image.open(src).convert("RGB")
              im.save(assets/out_name, "PNG", optimize=True)

          animals = [
              ("Sarah","assets/sarah.png"),
              ("Joy","assets/joy.png"),
              ("Wally","assets/wally.png"),
              ("Levi","assets/levi.png"),
              ("Freddy","assets/freddy.png"),
              ("Patsy","assets/patsy.png"),
              ("Davy","assets/davy.png"),
              ("Larry","assets/larry.png"),
              ("Francesco","assets/francesco.png"),
              ("Sweet-Pea","assets/sweetpea.png"),
              ("Willy","assets/willy.png"),
              ("Barry","assets/barry.png"),
          ]

          game_html = """<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malinda's Story Garden Matching Game: Volumes 1-12 - Offline</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#4b146f;text-align:center}
.wrap{width:100%;max-width:820px;margin:0 auto;padding:18px}
.gamebox{position:relative;border:4px solid #5b197d;border-radius:24px;background:#f8efff;padding:18px;box-shadow:0 10px 24px rgba(75,20,111,.18)}
h1{margin:0 0 6px;font-size:30px}
.instructions{margin:0 0 14px;font-weight:bold;font-size:17px}
.board-wrap{position:relative}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;position:relative}
.card{aspect-ratio:1/1;padding:0;border:3px solid #4b146f;border-radius:14px;overflow:hidden;cursor:pointer;background:linear-gradient(145deg,#8d48b2,#4b146f);color:white;font-size:42px;box-shadow:0 4px 9px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center}
.card img{width:100%;height:100%;object-fit:cover;display:block;background:white}
.card.matched{opacity:0;pointer-events:none;transition:opacity .3s ease}
.heart{color:white;font-size:1.2em;line-height:1}
.bottom{min-height:62px;padding-top:12px}
#message{min-height:22px;margin:0 0 8px;font-weight:bold;font-size:18px}
#reset{border:0;border-radius:999px;background:#5b197d;color:white;font-weight:bold;font-size:16px;padding:10px 18px;cursor:pointer}
.win-picture{position:absolute;inset:0;z-index:20;width:100%;height:100%;object-fit:contain;border-radius:14px;background:#fff;opacity:1;pointer-events:none}
.win-picture.flash{animation:winFlash .55s ease-in-out 4}
@keyframes winFlash{0%,100%{opacity:1}50%{opacity:.12}}
.note{font-size:13px;color:#684a74;margin-top:12px}
@media(max-width:520px){.wrap{padding:8px}.gamebox{padding:10px}.board{gap:6px}.card{border-width:2px;border-radius:11px}h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="gamebox">
    <h1>Malinda's Story Garden Matching Game: Volumes 1-12</h1>
    <p class="instructions">Turn over two purple tiles. Matching animals disappear!</p>
    <div class="board-wrap">
      <div class="board" id="board" aria-label="Animal matching game"></div>
    </div>
    <div class="bottom">
      <p id="message" aria-live="polite"></p>
      <button type="button" id="reset">Start Again</button>
    </div>
  </div>
  <p class="note">Offline stand-alone edition - no internet connection required.</p>
</div>
<script>
(function(){
  var animals = [
ANIMAL_JS
  ];
  var board=document.getElementById("board");
  var message=document.getElementById("message");
  var reset=document.getElementById("reset");
  var firstCard=null, secondCard=null, locked=false, matchedPairs=0;
  var celebrating=false, celebrationTimer=null;

  function shuffle(items){
    var i,j,t;
    for(i=items.length-1;i>0;i--){
      j=Math.floor(Math.random()*(i+1));
      t=items[i]; items[i]=items[j]; items[j]=t;
    }
    return items;
  }

  function makeDeck(){
    var deck=[],i,a;
    for(i=0;i<animals.length;i++){
      a=animals[i];
      deck.push({name:a.name,image:a.image,pair:a.name});
      deck.push({name:a.name,image:a.image,pair:a.name});
    }
    return shuffle(deck);
  }

  function coverCard(card){
    card.innerHTML='<span class="heart">&#9829;</span>';
    card.setAttribute("data-revealed","false");
    card.setAttribute("aria-label","Face-down animal tile");
  }

  function revealImage(card,animal){
    card.innerHTML='<img src="'+animal.image+'" alt="'+animal.name+'">';
    card.setAttribute("data-revealed","true");
    card.setAttribute("aria-label",animal.name);
  }

  function clearCelebration(){
    var old=board.querySelector ? board.querySelector(".win-picture") : null;
    if(old && old.parentNode) old.parentNode.removeChild(old);
    if(celebrationTimer) window.clearTimeout(celebrationTimer);
    celebrationTimer=null;
    celebrating=false;
  }

  function showWinCelebration(){
    if(celebrating) return;
    celebrating=true;
    var winner=document.createElement("img");
    winner.className="win-picture flash";
    winner.src="assets/jesus-loves-you-win.png";
    winner.alt="Sarah the Baby Sheep - JESUS LOVES YOU!";
    board.appendChild(winner);
    message.innerHTML="Wonderful! You matched all 12 animal friends! JESUS LOVES YOU!";
    celebrationTimer=window.setTimeout(function(){
      clearCelebration();
      startGame();
    },3000);
  }

  function startGame(){
    clearCelebration();
    board.innerHTML="";
    message.innerHTML="";
    firstCard=null; secondCard=null; locked=false; matchedPairs=0;
    var deck=makeDeck(),i;
    for(i=0;i<deck.length;i++){
      (function(animal){
        var card=document.createElement("button");
        card.type="button";
        card.className="card";
        card.setAttribute("data-pair",animal.pair);
        coverCard(card);
        card.onclick=function(){
          if(locked || card.className.indexOf("matched")>=0 || card.getAttribute("data-revealed")==="true") return;
          revealImage(card,animal);
          if(!firstCard){firstCard=card;return;}
          secondCard=card;locked=true;
          if(firstCard.getAttribute("data-pair")===secondCard.getAttribute("data-pair")){
            window.setTimeout(function(){
              firstCard.className+=" matched";
              secondCard.className+=" matched";
              matchedPairs++;
              firstCard=null; secondCard=null; locked=false;
              if(matchedPairs===12) showWinCelebration();
            },500);
          }else{
            window.setTimeout(function(){
              coverCard(firstCard);coverCard(secondCard);
              firstCard=null;secondCard=null;locked=false;
            },900);
          }
        };
        board.appendChild(card);
      })(deck[i]);
    }
  }
  reset.onclick=startGame;
  startGame();
})();
</script>
</body>
</html>"""

          animal_js = ",\n".join(
              '    {name:"%s",image:"%s"}' % (name.replace('"','\\"'), path)
              for name, path in animals
          )
          game_html = game_html.replace("ANIMAL_JS", animal_js)
          (pkg/"START_GAME.html").write_text(game_html, encoding="utf-8")

          readme_html = """<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>READ ME FIRST - Offline Matching Game</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#2f153f;margin:0}
.page{max-width:850px;margin:24px auto;padding:28px;border:4px solid #5b197d;border-radius:20px}
h1,h2{color:#4b146f}h1{text-align:center}li{margin:8px 0;line-height:1.45}
.notice{background:#f8efff;border:2px solid #d9b3ee;border-radius:12px;padding:14px;font-weight:bold}
</style>
</head>
<body><div class="page">
<h1>READ ME FIRST</h1>
<h2>Malinda's Story Garden Matching Game: Volumes 1-12</h2>
<p class="notice">This is a stand-alone OFFLINE game. After you download it, no internet connection is needed.</p>
<h2>Windows 7 Instructions</h2>
<ol>
<li>Download the main ZIP file.</li>
<li><strong>Extract the ZIP first.</strong> Do not try to play the game while it is still inside the ZIP.</li>
<li>Open the extracted folder named <strong>Malindas_Story_Garden_Matching_Game_OFFLINE</strong>.</li>
<li>Double-click <strong>START_GAME.html</strong>.</li>
<li>If Windows asks which program to use, choose Firefox or Chrome.</li>
<li>Keep the <strong>START_GAME.html</strong> file and the <strong>assets</strong> folder together. The pictures are stored locally in that folder.</li>
</ol>
<h2>How to Play</h2>
<ol>
<li>Click one purple heart tile to reveal an animal friend.</li>
<li>Click a second purple heart tile.</li>
<li>If the two pictures match, they disappear.</li>
<li>If they do not match, they turn back over.</li>
<li>Continue until all 12 pairs are matched.</li>
<li>When you win, the Sarah <strong>JESUS LOVES YOU!</strong> picture flashes just like the website game, then a new game starts automatically.</li>
</ol>
<h2>Printable Pictures</h2>
<p>The file <strong>PRINTABLE_PDF_PICTURES.zip</strong> contains 13 separate printable PDF files: the 12 animal pictures used by the game plus the JESUS LOVES YOU win picture.</p>
<p>Extract that second ZIP before printing the PDFs.</p>
<h2>Package Contents</h2>
<ul>
<li>START_GAME.html - the offline game</li>
<li>START_HERE_READ_ME.html - these instructions</li>
<li>START_HERE_READ_ME.txt - plain-text copy of these instructions</li>
<li>assets folder - all 13 local picture files used by the game</li>
<li>PRINTABLE_PDF_PICTURES.zip - printable PDF versions of all 13 pictures</li>
</ul>
<p><strong>Important:</strong> Do not rename, move, or delete the assets folder if you want the game pictures to appear.</p>
</div></body></html>"""
          (pkg/"START_HERE_READ_ME.html").write_text(readme_html, encoding="utf-8")

          readme_txt = """READ ME FIRST
Malinda's Story Garden Matching Game: Volumes 1-12
OFFLINE STAND-ALONE EDITION

WINDOWS 7 INSTRUCTIONS
1. Download the main ZIP file.
2. EXTRACT THE ZIP FIRST. Do not play the game from inside the ZIP.
3. Open the extracted folder: Malindas_Story_Garden_Matching_Game_OFFLINE
4. Double-click START_GAME.html
5. If Windows asks what program to use, choose Firefox or Chrome.
6. Keep START_GAME.html and the assets folder together.

HOW TO PLAY
1. Click one purple heart tile.
2. Click a second purple heart tile.
3. Matching pictures disappear.
4. Non-matching pictures turn back over.
5. Match all 12 pairs.
6. When you win, the Sarah JESUS LOVES YOU! picture flashes, then a new game starts automatically.

PRINTABLE PICTURES
PRINTABLE_PDF_PICTURES.zip contains 13 separate printable PDF files:
- the 12 animal pictures used in the game
- the JESUS LOVES YOU win picture

Extract PRINTABLE_PDF_PICTURES.zip before printing.

NO INTERNET CONNECTION IS REQUIRED AFTER DOWNLOAD.
"""
          (pkg/"START_HERE_READ_ME.txt").write_text(readme_txt, encoding="utf-8")

          # Create 13 printable letter-size PDFs.
          page_w, page_h = letter
          purple = HexColor("#4b146f")
          for label, src, out_name in image_sources:
              png_path = assets/out_name
              safe = "".join(ch if ch.isalnum() or ch in " -_" else "_" for ch in label).strip().replace(" ","_")
              pdf_path = pdfs/(safe + ".pdf")
              c = canvas.Canvas(str(pdf_path), pagesize=letter)
              c.setFillColorRGB(1,1,1)
              c.rect(0,0,page_w,page_h,fill=1,stroke=0)
              c.setFillColor(purple)
              c.setFont("Helvetica-Bold", 15)
              title = label
              c.drawCentredString(page_w/2, page_h-34, title[:70])
              img = Image.open(png_path)
              iw, ih = img.size
              max_w = page_w - 44
              max_h = page_h - 78
              scale = min(max_w/iw, max_h/ih)
              draw_w, draw_h = iw*scale, ih*scale
              x=(page_w-draw_w)/2
              y=(page_h-draw_h-20)/2
              c.drawImage(ImageReader(img), x, y, width=draw_w, height=draw_h, preserveAspectRatio=True, mask='auto')
              c.showPage()
              c.save()

          inner_zip = pkg/"PRINTABLE_PDF_PICTURES.zip"
          with zipfile.ZipFile(inner_zip, "w", zipfile.ZIP_DEFLATED) as z:
              for f in sorted(pdfs.glob("*.pdf")):
                  z.write(f, arcname=f.name)
              z.writestr("READ_ME_PRINTABLE_PDFS.txt",
                         "This ZIP contains 13 printable PDF picture files from the offline matching game. "
                         "Extract the ZIP before printing. Each PDF is formatted on 8.5 x 11 inch letter-size paper.\\n")

          # Keep the main package tidy: printable PDFs are delivered in the inner ZIP.
          shutil.rmtree(pdfs)

          main_zip = dist/"Malindas_Story_Garden_Matching_Game_OFFLINE_PACKAGE.zip"
          if main_zip.exists():
              main_zip.unlink()
          with zipfile.ZipFile(main_zip, "w", zipfile.ZIP_DEFLATED) as z:
              for f in pkg.rglob("*"):
                  if f.is_file():
                      z.write(f, arcname=str(Path(pkg.name)/f.relative_to(pkg)))

          print(main_zip)
          PY

      - name: Upload finished package
        uses: actions/upload-artifact@v4
        with:
          name: Malindas_Story_Garden_Matching_Game_OFFLINE_PACKAGE
          path: dist/Malindas_Story_Garden_Matching_Game_OFFLINE_PACKAGE.zip
          if-no-files-found: error
          retention-days: 7
