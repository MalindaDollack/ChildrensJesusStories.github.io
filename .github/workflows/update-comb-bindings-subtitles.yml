name: Update Comb Bindings and Sarah Subtitles

on:
  push:
    paths:
      - '.github/workflows/update-comb-bindings-subtitles.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested comb binding and subtitle changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- Create four comb-bound cover variants ----------
          src_path = Path('web-images/sarah-coil-bound-cover.svg')
          src = src_path.read_text(encoding='utf-8')

          spine_re = re.compile(
              r'<g aria-label="clearly visible clear coil binding">.*?<text x="525" y="988".*?</text>',
              re.S
          )
          if not spine_re.search(src):
              raise SystemExit('Could not locate the existing coil-binding spine block')

          def comb_block(color):
              teeth = []
              for y in range(61, 946, 45):
                  teeth.append(f'<rect x="78" y="{y}" width="68" height="16" rx="8" fill="{color}"/>')
              teeth_markup = '\n'.join(teeth)
              return f'''<g aria-label="comb binding" filter="url(#coilShadow)">
<rect x="48" y="48" width="42" height="902" rx="12" fill="{color}"/>
{teeth_markup}
</g>
<text x="525" y="988" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="{color}">COMB-BINDING</text>'''

          variants = {
              'web-images/pid9-comb-bound-dark-red.svg': '#8B0000',
              'web-images/pid10-comb-bound-dark-green.svg': '#006400',
              'web-images/pid12-comb-bound-dark-blue.svg': '#00008B',
              'web-images/pid13-comb-bound-dark-yellow.svg': '#B8860B',
          }
          for filename, color in variants.items():
              Path(filename).write_text(spine_re.sub(comb_block(color), src, count=1), encoding='utf-8')

          # ---------- Update only the four requested product pictures ----------
          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')

          product_images = {
              'PID9': 'web-images/pid9-comb-bound-dark-red.svg?v=1',
              'PID10': 'web-images/pid10-comb-bound-dark-green.svg?v=1',
              'PID12': 'web-images/pid12-comb-bound-dark-blue.svg?v=1',
              'PID13': 'web-images/pid13-comb-bound-dark-yellow.svg?v=1',
          }

          for code, image in product_images.items():
              heading = re.search(r'<h3[^>]*>\s*' + re.escape(code) + r'\s+—', text)
              if not heading:
                  raise SystemExit(f'Could not find {code} heading')
              start = text.rfind('<article', 0, heading.start())
              end = text.find('</article>', heading.end())
              if start < 0 or end < 0:
                  raise SystemExit(f'Could not isolate {code} article')
              end += len('</article>')
              article = text[start:end]
              article2, n = re.subn(r'(<img\b[^>]*\bsrc=")[^"]+("[^>]*>)', r'\1' + image + r'\2', article, count=1)
              if n != 1:
                  raise SystemExit(f'Could not replace main image for {code}')
              text = text[:start] + article2 + text[end:]

          # ---------- Sarah subtitle wording and formatting ----------
          subtitle_html = "Subtitle: Jesus's Birth through the <strong class=\"big-blue-eyes\">BIG BLUE EYES</strong> of Sarah the Baby Sheep !"
          subtitle_p = '<p class="isbn-product-subtitle">' + subtitle_html + '</p>'
          old_subtitle_re = re.compile(
              r'<p class="isbn-product-subtitle">\s*(?:Subtitle:\s*)?Jesus\'s\s+birth\s+through\s+the\s+eyes\s+of\s+Sarah\s+the\s+baby\s+[Ss]heep\s*!\s*</p>',
              re.I
          )
          text, main_count = old_subtitle_re.subn(subtitle_p, text)
          if main_count == 0:
              raise SystemExit('No static Sarah product subtitles were found to update')

          desc_subtitle_re = re.compile(
              r'<p>\s*(?:<strong>)?\s*Subtitle:\s*Jesus\'s\s+birth\s+through\s+the\s+eyes\s+of\s+Sarah\s+the\s+baby\s+[Ss]heep\s*!\s*(?:</strong>)?\s*</p>',
              re.I
          )
          text = desc_subtitle_re.sub('<p class="isbn-description-subtitle">' + subtitle_html + '</p>', text)

          # Complete Collection Sarah subtitle only; Sweet-Pea remains untouched.
          book_sub_re = re.compile(
              r'subtitle:"Jesus\'s birth through the eyes of Sarah the baby [Ss]heep !"'
          )
          book_sub_new = 'subtitle:"<span class=\'sarah-subtitle-text\'>Jesus\'s Birth through the <strong class=\'big-blue-eyes\'>BIG BLUE EYES</strong> of Sarah the Baby Sheep !</span>"'
          text, book_count = book_sub_re.subn(book_sub_new, text, count=1)
          if book_count != 1:
              raise SystemExit(f'Expected one Complete Collection Sarah subtitle, changed {book_count}')

          style = '''
<style id="sarah-subtitle-colors">
.isbn-product-subtitle,
.isbn-description-subtitle,
.sarah-subtitle-text{
  color:#00008B!important;
  font-weight:400!important;
}
.big-blue-eyes{
  color:#00AEEF!important;
  font-weight:800!important;
}
</style>
'''
          if 'id="sarah-subtitle-colors"' not in text:
              text = text.replace('</head>', style + '</head>', 1)

          index_path.write_text(text, encoding='utf-8')

          # ---------- Keep runtime subtitle updater from overwriting the new format ----------
          js_path = Path('script-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(
              r'const subtitle = "Jesus\'s birth through the eyes of Sarah the baby [Ss]heep !";',
              'const subtitle = "Jesus\'s Birth through the BIG BLUE EYES of Sarah the Baby Sheep !";\n    const subtitleHtml = "Jesus\'s Birth through the <strong class=\'big-blue-eyes\'>BIG BLUE EYES</strong> of Sarah the Baby Sheep !";',
              js,
              count=1
          )
          js = js.replace("subtitleLine.textContent = subtitle;", "subtitleLine.innerHTML = 'Subtitle: ' + subtitleHtml;")
          js = js.replace("subtitleLine.style.cssText = 'font-weight:800;color:#4b146f;margin:4px 0 8px;line-height:1.3;';", "subtitleLine.style.cssText = 'font-weight:400;color:#00008B;margin:4px 0 8px;line-height:1.3;';")
          js = js.replace(
              "      const subtitleStrong = document.createElement('strong');\n      subtitleStrong.textContent = subtitle;\n      descriptionSubtitle.appendChild(subtitleStrong);",
              "      descriptionSubtitle.innerHTML = 'Subtitle: ' + subtitleHtml;\n      descriptionSubtitle.style.cssText = 'font-weight:400;color:#00008B;line-height:1.3;';"
          )
          js_path.write_text(js, encoding='utf-8')

          # Validation
          check = index_path.read_text(encoding='utf-8')
          for code, image in product_images.items():
              if image not in check:
                  raise SystemExit(f'Validation failed: {code} image not present')
          if "Jesus's Birth through the <strong class=\"big-blue-eyes\">BIG BLUE EYES</strong> of Sarah the Baby Sheep !" not in check:
              raise SystemExit('Validation failed: formatted subtitle not present')
          PY
      - name: Commit requested website changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script-enhancements.js web-images/pid9-comb-bound-dark-red.svg web-images/pid10-comb-bound-dark-green.svg web-images/pid12-comb-bound-dark-blue.svg web-images/pid13-comb-bound-dark-yellow.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update comb binding colors and Sarah subtitles"
          git push
