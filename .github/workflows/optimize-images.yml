name: Optimize website images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install lossless image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng jpegoptim

      - name: Losslessly optimize PNG images
        run: |
          find . -type f \( -iname '*.png' -o -iname '*.PNG' \) -not -path './.git/*' -print0 | xargs -0 -r -n1 optipng -o7 -strip all -quiet

      - name: Optimize JPEG images if present
        run: |
          find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.JPG' -o -iname '*.JPEG' \) -not -path './.git/*' -print0 | xargs -0 -r jpegoptim --strip-all --max=92 --preserve

      - name: Commit optimized images
        run: |
          if git diff --quiet; then
            echo 'Images are already optimized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.png' '*.PNG' '*.jpg' '*.jpeg' '*.JPG' '*.JPEG'
          git commit -m 'Optimize website images for faster loading [skip ci]'
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
