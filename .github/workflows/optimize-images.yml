name: Optimize website images

on:
  push:
    branches: [main]
    paths:
      - '**/*.png'
      - '**/*.PNG'
      - '**/*.jpg'
      - '**/*.JPG'
      - '**/*.jpeg'
      - '**/*.JPEG'
      - '.github/workflows/optimize-images.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-website-images
  cancel-in-progress: true

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main website branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install lossless image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng jpegoptim

      - name: Losslessly optimize PNG images
        run: |
          find . -type f \( -iname '*.png' -o -iname '*.PNG' \) \
            -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 optipng -o2 -strip all -quiet

      - name: Losslessly optimize JPEG images
        run: |
          find . -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.JPG' -o -iname '*.JPEG' \) \
            -not -path './.git/*' -print0 \
            | xargs -0 -r jpegoptim --strip-all --preserve

      - name: Commit optimized images only when needed
        run: |
          if git diff --quiet; then
            echo 'Images are already optimized. No changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi

          git commit -m 'Optimize website images for faster loading [skip ci]'

          # If another website update landed while this job was running,
          # rebase the optimization commit onto the newest main branch first.
          git pull --rebase origin main
          git push origin main
