name: Optimize website images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-website-images
  cancel-in-progress: true

jobs:
  optimize-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main website branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Create lightweight WebP website copies
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          outdir = Path('web-images')
          outdir.mkdir(exist_ok=True)

          for p in Path('.').glob('*'):
              if p.suffix.lower() not in {'.png','.jpg','.jpeg'}:
                  continue
              try:
                  im = Image.open(p).convert('RGB')
              except Exception:
                  continue

              max_width = 900
              if im.width > max_width:
                  new_h = round(im.height * max_width / im.width)
                  im = im.resize((max_width, new_h), Image.Resampling.LANCZOS)

              out = outdir / (p.stem + '.webp')
              im.save(out, 'WEBP', quality=68, method=6)
              print(f'{p.name} -> {out}')
          PY

      - name: Commit lightweight website copies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web-images

          if git diff --cached --quiet; then
            echo 'No web image changes to commit.'
            exit 0
          fi

          git commit -m 'Create lightweight web images for faster loading [skip ci]'
          git pull --rebase origin main
          git push origin main
