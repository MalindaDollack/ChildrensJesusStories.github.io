name: Fix shelf subtitles October 5 2026

on:
  push:
    paths:
      - '.github/workflows/fix-shelf-subtitles-20261005.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix heading and shelf subtitles
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace('Children’s Bible Stories & Christian Books for Kids', 'Children’s Bible Stories For Children')
          text = text.replace("Children's Bible Stories & Christian Books for Kids", "Children’s Bible Stories For Children")

          subtitles = {
              'Sarah': "Jesus's Birth told through the <strong class='big-blue-eyes'>BIG BLUE EYES</strong> of Sarah the Baby Sheep !",
              'Sweet-Pea': "God's Message of Caring told through the <strong class='big-blue-eyes'>BIG BLUE EYES</strong> of Sweet-Pea the Baby Sparrow !",
              'Larry': "God's Message of Thankfulness and Healing told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> of Larry the Lizard !",
              'Davy': "God's Message of Kindness and Truthfulness told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Davy the Donkey !",
              'Patsy': "God's Message of How to Dress told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Patsy the Plain Peacock !",
              'Francesco': "God's Message of Obedience told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Francesco the Frog !",
              'Freddy': "God's Message of Trust told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Freddy the Ferret !",
              'Joy': "God's Message of Heaven and how He sings over all of us told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Joy the Fish !",
              'Willy': "God's Message Keeping Our Eyes on Jesus told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Willy the Water Strider Bug !",
              'Wally': "God's Message of Always Do What God Says told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Wally the Whale !",
              'Levi': "God's Message of Protection told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Levi the Lion !",
              'Barry': "God's Message of Healing told through <strong class='big-blue-eyes'>BIG BLUE EYES</strong> Barry the Blind Mole !",
          }

          for name, subtitle in subtitles.items():
              pattern = re.compile(r'(\{name:["\']' + re.escape(name) + r'["\'][^\n]*?title:["\'][^"\']*["\'])([^\n]*?ref:)', re.M)
              def repl(m):
                  first = m.group(1)
                  rest = m.group(2)
                  if 'subtitle:' in first:
                      return m.group(0)
                  return first + ', subtitle:"' + subtitle.replace('"','\\"') + '"' + rest
              text = pattern.sub(repl, text)

          # Ensure Patsy's newly supplied title is used.
          text = re.sub(
              r'Patsy the Plain Peacock:[^"\']*?(?:Esther 4:13[-–]17 \(NIV\)|Proverbs 31:[^"\']*)?',
              'Patsy the Plain Peacock: Gives Queen Esther Fashion Advice Esther 4:13-17 (NIV).',
              text,
              count=1
          )

          # The old generator only showed subtitles for the first two cards.
          text = text.replace('i<2&&b.subtitle', 'b.subtitle')

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'Malinda Dollack'
          git config user.email 'dollackj316@gmail.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Show all 12 subtitles and update shelf heading'
          git push
