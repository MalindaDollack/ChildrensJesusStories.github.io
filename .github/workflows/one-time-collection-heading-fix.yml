name: One-time collection heading fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/one-time-collection-heading-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace exact collection heading in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = '<div class="section-title"><span>📚</span><div><small>THE COMPLETE COLLECTION</small><h2>Childrens Bible Stories</h2>'
          new = '<div class="section-title"><span>📚</span><div><small>THE COMPLETE COLLECTION</small><h2>Children’s Bible Adventures For Children</h2>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one matching collection heading, found {count}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit permanent source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Update complete collection heading"
          git push origin HEAD:main
