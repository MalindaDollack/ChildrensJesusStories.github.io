name: Update PID7 PID8 Baby Book Pictures

on:
  push:
    paths:
      - '.github/workflows/update-pid7-pid8-baby-book-pictures-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-baby-book-pictures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Replace PID7 and PID8 pictures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          main_src = 'baby book thank you.jpg?v=20261004'
          main_alt = 'baby book thank you.jpg'
          detail_files = [
              'baby book spread.jpg',
              'baby book alone.jpg',
              'baby book horizontal.jpg',
              'baby book vertical.jpg',
              'baby book dedication.jpg',
              'baby book frog.jpg',
              'baby book mailing.jpg',
          ]

          gallery = '\n<!-- PID7-PID8-BABY-DETAIL-GALLERY-START -->\n'
          gallery += '<div class="pid-baby-book-photo-gallery" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:18px 0 22px;">\n'
          for filename in detail_files:
              gallery += (
                  '<figure style="margin:0;text-align:center;">'
                  f'<img loading="lazy" decoding="async" src="{filename}?v=20261004" alt="{filename}" '
                  'style="display:block;width:100%;height:auto!important;aspect-ratio:auto!important;object-fit:contain;background:#fff;margin:0 auto;">'
                  f'<figcaption style="margin-top:6px;color:#4b146f;font-weight:800;line-height:1.25;">{filename}</figcaption>'
                  '</figure>\n'
              )
          gallery += '</div>\n<!-- PID7-PID8-BABY-DETAIL-GALLERY-END -->\n'

          def update_card(card_id):
              global text
              pattern = re.compile(r'(<article\b[^>]*id="' + re.escape(card_id) + r'"[^>]*>.*?</article>)', re.S)
              match = pattern.search(text)
              if not match:
                  raise SystemExit(f'Could not find {card_id}')
              block = match.group(1)

              # Remove any prior copy of this new detail gallery so the job is safe to re-run.
              block = re.sub(
                  r'\n?<!-- PID7-PID8-BABY-DETAIL-GALLERY-START -->.*?<!-- PID7-PID8-BABY-DETAIL-GALLERY-END -->\n?',
                  '\n',
                  block,
                  flags=re.S,
              )

              # Replace every current main/gallery picture area before the product heading
              # with one and only one main picture.
              article_open_end = block.find('>') + 1
              heading_start = block.find('<h3')
              if article_open_end <= 0 or heading_start < 0:
                  raise SystemExit(f'Could not locate picture/heading area for {card_id}')
              main_picture = (
                  f'\n<img loading="lazy" decoding="async" src="{main_src}" alt="{main_alt}" '
                  'style="display:block;width:100%;height:auto!important;aspect-ratio:auto!important;object-fit:contain;background:#fff;margin:0 auto;">\n'
              )
              block = block[:article_open_end] + main_picture + block[heading_start:]

              # Put the seven remaining photographs inside the expandable description.
              details_match = re.search(r'<div class="store-details"\s+hidden>', block)
              if not details_match:
                  raise SystemExit(f'Could not find description for {card_id}')
              insert_at = details_match.end()
              block = block[:insert_at] + gallery + block[insert_at:]

              text = text[:match.start()] + block + text[match.end():]

          update_card('store-PID7')
          update_card('store-PID8')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit website update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace PID7 and PID8 baby book pictures"
          git push
