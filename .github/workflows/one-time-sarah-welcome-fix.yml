name: One-time Sarah welcome text fix

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/one-time-sarah-welcome-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace exact Sarah welcome paragraph in index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          old = "Welcome to Malinda’s Story Garden, where children meet adorable animal friends through Bible Adventures and Bible adventures as we learn about Jesus together!"
          new = "Welcome to Malinda’s Story Garden, where Children meet Adorable Animal Friends through Bible Adventures as we learn about Jesus together!"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one matching Sarah welcome paragraph, found {count}.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit permanent source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m "Update Sarah welcome paragraph"
          git push origin HEAD:main
