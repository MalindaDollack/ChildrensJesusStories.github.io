name: Restore Comb-Bound Cover Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put original cover photo beside each comb binding picture
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          pictures = {
              'PID9':  'web-images/pid9-comb-bound-dark-red.svg?v=20261003d',
              'PID10': 'web-images/pid10-comb-bound-dark-green.svg?v=20261003d',
              'PID12': 'web-images/pid12-comb-bound-dark-blue.svg?v=20261003d',
              'PID13': 'web-images/pid13-comb-bound-dark-yellow.svg?v=20261003d',
          }
          cover = 'web-images/sarah-coil-bound-cover-photo.webp?v=20261003d'

          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S)

          def patch_article(match):
              article = match.group(0)
              hm = re.search(r'<h3[^>]*>\s*(PID9|PID10|PID12|PID13)\s*—', article, re.S)
              if not hm:
                  return article
              code = hm.group(1)
              binding = pictures[code]
              gallery = (
                  '<div class="product-gallery comb-cover-gallery" '
                  'style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;">'
                  f'<img loading="lazy" decoding="async" src="{binding}" alt="{code} comb binding picture" '
                  'style="width:100%;height:250px;object-fit:contain;background:#fff;">'
                  f'<img loading="lazy" decoding="async" src="{cover}" alt="{code} original cover picture" '
                  'style="width:100%;height:250px;object-fit:contain;background:#fff;">'
                  '</div>'
              )

              # Remove the current main picture/gallery before the product heading, then add the two-picture gallery.
              before_heading = article[:hm.start()]
              after_heading = article[hm.start():]
              before_heading = re.sub(
                  r'(?:<div class="product-gallery[^>]*>.*?</div>|<img\b[^>]*>)\s*$',
                  '',
                  before_heading,
                  count=1,
                  flags=re.S
              )
              return before_heading + gallery + '\n' + after_heading

          new_text = article_re.sub(patch_article, text)
          if new_text == text:
              raise SystemExit('No comb-bound product listings were changed.')

          path.write_text(new_text, encoding='utf-8')

      - name: Commit restored cover pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore cover photos beside comb binding images"
          git push
