name: Restore Comb-Bound Cover Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put real Sarah cover under each colored comb binding
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          colors = {
              'PID9':  '#8B0000',
              'PID10': '#006400',
              'PID12': '#00008B',
              'PID13': '#B8860B',
          }
          cover = 'web-images/sarah%20book%20cover%20for%20library.webp?v=20261003j'
          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S)

          def make_gallery(code):
              color = colors[code]
              teeth = ''.join(
                  f'<span style="position:absolute;left:7.8%;top:{6.1 + i*4.5:.1f}%;width:6.8%;height:1.6%;background:{color};border-radius:8px;z-index:3;"></span>'
                  for i in range(20)
              )
              return (
                  '<div class="product-gallery comb-bound-cover" '
                  'style="position:relative;width:100%;max-width:420px;aspect-ratio:1/1;margin:0 auto;background:#fff;overflow:hidden;">'
                  '<div style="position:absolute;left:10.5%;top:3.5%;width:85%;height:93%;background:#fff;border:4px solid #4b146f;border-radius:18px;box-sizing:border-box;z-index:1;"></div>'
                  f'<img loading="lazy" decoding="async" src="{cover}" alt="{code} Sarah book cover" '
                  'style="position:absolute;left:12%;top:5%;width:81.5%;height:90%;object-fit:contain;background:#fff;z-index:2;">'
                  f'<div style="position:absolute;left:4.8%;top:4.8%;width:4.2%;height:90.2%;background:{color};border-radius:12px;z-index:3;"></div>'
                  + teeth +
                  f'<div style="position:absolute;left:0;right:0;bottom:0.3%;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:{color};z-index:4;">COMB-BINDING</div>'
                  '</div>'
              )

          def patch_article(match):
              article = match.group(0)
              hm = re.search(r'<h3[^>]*>\s*(PID9|PID10|PID12|PID13)\s*—', article, re.S)
              if not hm:
                  return article
              code = hm.group(1)
              before_heading = article[:hm.start()]
              after_heading = article[hm.start():]
              gallery_start = before_heading.rfind('<div class="product-gallery')
              if gallery_start != -1:
                  before_heading = before_heading[:gallery_start]
              else:
                  image_start = before_heading.rfind('<img')
                  if image_start != -1:
                      before_heading = before_heading[:image_start]
              return before_heading + make_gallery(code) + '\n' + after_heading

          new_text = article_re.sub(patch_article, text)
          if new_text == text:
              raise SystemExit('No comb-bound product listings were changed.')
          path.write_text(new_text, encoding='utf-8')

      - name: Commit visible comb-bound covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Harden comb-bound Sarah cover image URLs"
          git push
