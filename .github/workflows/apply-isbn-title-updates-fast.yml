name: Restore Comb-Bound Cover Photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put correct comb binding directly on each original cover picture
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          bindings = {
              'PID9':  'web-images/pid9-comb-bound-dark-red.svg?v=20261003f',
              'PID10': 'web-images/pid10-comb-bound-dark-green.svg?v=20261003f',
              'PID12': 'web-images/pid12-comb-bound-dark-blue.svg?v=20261003f',
              'PID13': 'web-images/pid13-comb-bound-dark-yellow.svg?v=20261003f',
          }
          cover = 'web-images/sarah-coil-bound-cover-photo.webp?v=20261003f'
          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S)

          def patch_article(match):
              article = match.group(0)
              hm = re.search(r'<h3[^>]*>\s*(PID9|PID10|PID12|PID13)\s*—', article, re.S)
              if not hm:
                  return article
              code = hm.group(1)
              binding = bindings[code]

              combined = (
                  '<div class="product-gallery comb-cover-gallery" '
                  'style="position:relative;height:300px;background:#fff;overflow:hidden;">'
                  f'<img loading="lazy" decoding="async" src="{cover}" alt="{code} cover picture" '
                  'style="display:block;width:100%;height:300px;object-fit:contain;background:#fff;">'
                  f'<img loading="lazy" decoding="async" src="{binding}" alt="{code} comb binding" '
                  'style="position:absolute;left:7%;top:0;height:300px;width:auto;object-fit:contain;background:transparent;pointer-events:none;">'
                  '</div>'
              )

              before_heading = article[:hm.start()]
              after_heading = article[hm.start():]
              before_heading = re.sub(
                  r'(?:<div class="product-gallery[^>]*>.*?</div>|<img\b[^>]*>)\s*$',
                  '',
                  before_heading,
                  count=1,
                  flags=re.S
              )
              return before_heading + combined + '\n' + after_heading

          new_text = article_re.sub(patch_article, text)
          if new_text == text:
              raise SystemExit('No comb-bound product listings were changed.')

          path.write_text(new_text, encoding='utf-8')

      - name: Commit corrected comb-bound cover pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Put comb binding on original cover pictures"
          git push
