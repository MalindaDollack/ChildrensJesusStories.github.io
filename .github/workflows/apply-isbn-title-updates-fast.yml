name: Apply Exact PID1-6 DID1 DID2 Wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update product listings descriptions and prepared emails
        shell: python
        run: |
          from pathlib import Path
          import html
          import re

          titles = {
              'PID1': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 1 Laminated Book Mark.",
              'PID2': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 2 Laminated Book Marks.",
              'PID3': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 5 Laminated Book Marks.",
              'PID4': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 20 Hand Made Small Jesus Loves You ! Stickers.",
              'PID5': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 4 Hand Made Medium Jesus Loves You ! Stickers.",
              'PID6': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) Hand-Made Color JESUS LOVES YOU ! with Sarah the Baby Sheep - 1 Hand Made Large Jesus Loves You ! Sticker.",
              'DID1': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story. Luke 2: 1-20 (NIV) JESUS LOVES YOU ! with Sarah the Baby Sheep - 1 Digital file.png \"Book Mark\"",
              'DID2': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth, The Christmas Story Edition. Luke 2: 1-20 (NIV) JESUS LOVES YOU ! Matching Game.",
          }
          subtitle_text = "Jesus's Birth through the BIG BLUE EYES of Sarah the Baby Sheep !"
          subtitle_html = "Subtitle: Jesus's Birth through the <strong class=\"big-blue-eyes\">BIG BLUE EYES</strong> of Sarah the Baby Sheep !"

          index_path = Path('index.html')
          text = index_path.read_text(encoding='utf-8')
          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S | re.I)

          def article_for(code, source):
              for m in article_re.finditer(source):
                  if re.search(r'<h3[^>]*>\s*' + re.escape(code) + r'\s*(?:—|–|-)\s*', m.group(0), re.I):
                      return m.group(0)
              return None

          # Move the existing DID6 Matching Game into DID2's position and remove the downloadable sticker listing.
          old_did2 = article_for('DID2', text)
          old_did6 = article_for('DID6', text)
          if not old_did2 or not old_did6:
              raise SystemExit('Could not find both the current DID2 sticker listing and DID6 Matching Game listing.')

          moved = old_did6
          moved = re.sub(r'(<article\b)(?![^>]*\bid=)', r'\1 id="store-DID2"', moved, count=1, flags=re.I)
          moved = re.sub(r'\bid="store-DID6"', 'id="store-DID2"', moved, count=1, flags=re.I)
          moved = re.sub(r'(<h3[^>]*>)\s*DID6\s*(?:—|–|-)\s*.*?(</h3>)', r'\1DID2 — ' + html.escape(titles['DID2']) + r'\2', moved, count=1, flags=re.S | re.I)
          moved = moved.replace('data-email-form="m12"', 'data-email-form="m8"')
          moved = moved.replace("openPreparedEmail('m12')", "openPreparedEmail('m8')")
          text = text.replace(old_did2, moved, 1)
          text = text.replace(old_did6, '', 1)

          # Give DID1 a stable id too.
          did1 = article_for('DID1', text)
          if did1 and 'id="store-DID1"' not in did1:
              did1_new = re.sub(r'<article\b', '<article id="store-DID1"', did1, count=1)
              text = text.replace(did1, did1_new, 1)

          def patch_article(match):
              article = match.group(0)
              hm = re.search(r'<h3([^>]*)>\s*([A-Z0-9]+)\s*(?:—|–|-)\s*.*?</h3>', article, re.S | re.I)
              if not hm:
                  return article
              code = hm.group(2).upper()
              if code not in titles:
                  return article

              title = titles[code]
              safe_title = html.escape(title)
              new_h3 = f'<h3{hm.group(1)}>{code} — {safe_title}</h3>'
              article = article[:hm.start()] + new_h3 + article[hm.end():]

              article = re.sub(r'\s*<p\s+class="isbn-product-subtitle"[^>]*>.*?</p>', '', article, flags=re.S | re.I)
              h3_end = article.find('</h3>') + len('</h3>')
              article = article[:h3_end] + f'\n<p class="isbn-product-subtitle">{subtitle_html}</p>' + article[h3_end:]

              article = re.sub(r'<div\s+class="isbn-title-description"[^>]*>.*?</div>\s*', '', article, flags=re.S | re.I)
              desc = (
                  '<div class="isbn-title-description">'
                  f'<p><strong>{safe_title}</strong></p>'
                  f'<p class="isbn-description-subtitle">{subtitle_html}</p>'
                  '</div>'
              )
              article, n = re.subn(r'(<div\s+class="store-details"[^>]*>)', r'\1\n' + desc, article, count=1, flags=re.I)
              if n != 1:
                  raise SystemExit(f'Store details block not found for {code}.')
              return article

          text = article_re.sub(patch_article, text)

          # Update prepared email forms for PID1-6, DID1 and the new DID2.
          if 'id="clean-prepared-email-links"' not in text:
              raise SystemExit('Prepared email forms block not found.')

          for code, title in titles.items():
              pattern = re.compile(r'("subject":"' + re.escape(code) + r'","body":")((?:\\.|[^"])*)(' + r'"})')
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'Prepared email form not found for {code}.')
              body = m.group(2)
              start = body.find('I would like to order: ')
              end = body.find(r'\n\nMy name:', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Could not locate order text in prepared email for {code}.')
              email_title = title.replace('\\', '\\\\').replace('"', '\\"')
              exact = f'I would like to order: {code} - {email_title}\\nSubtitle: {subtitle_text}'
              new_body = body[:start] + exact + body[end:]
              text = text[:m.start(2)] + new_body + text[m.end(2):]

          # Remove the obsolete DID6 prepared form entirely.
          text, removed = re.subn(r',"m12":\{"subject":"DID6","body":"(?:\\.|[^"])*"\}', '', text, count=1)
          if removed != 1:
              raise SystemExit('Obsolete DID6 prepared email form was not found.')

          index_path.write_text(text, encoding='utf-8')

          # Keep the late-running title controller from restoring older names.
          js_path = Path('script-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          for code, title in reversed(list(titles.items())):
              esc = title.replace('\\', '\\\\').replace('"', '\\"')
              line = f'      {code}: {{ title: "{esc}" }},'
              patt = re.compile(r'^\s*' + re.escape(code) + r': \{ title: ".*?" \},\s*$', re.M)
              if patt.search(js):
                  js = patt.sub(line, js, count=1)
              else:
                  js = js.replace('    const listings = {\n', '    const listings = {\n' + line + '\n', 1)
          js_path.write_text(js, encoding='utf-8')

          # Include the newly retitled Sarah items in generic email normalization as a fallback.
          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          codes = 'SESB1|PID1|PID2|PID3|PID4|PID5|PID6|PID7|PID8|PID9|PID10|PID11|PID12|PID13|PID14|PID16|PID17|DID1|DID2|DID3|DID4'
          script, n = re.subn(r'var isSarahBookListing = /\^\(\?:.*?\)\$/i\.test\(productCode\);', f'var isSarahBookListing = /^(?:{codes})$/i.test(productCode);', script, count=1)
          if n != 1:
              raise SystemExit('Could not update Sarah email-normalizer code list.')
          script_path.write_text(script, encoding='utf-8')

      - name: Commit exact product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script-enhancements.js script.js
          git diff --cached --quiet && exit 0
          git commit -m "Update PID1-6 DID1 DID2 titles and move matching game"
          git push
