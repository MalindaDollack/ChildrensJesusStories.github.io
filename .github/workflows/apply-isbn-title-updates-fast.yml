name: Keep Exact Sarah Product Wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-email-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add exact Sarah subtitle to prepared order emails
        shell: python
        run: |
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          if 'var isSarahBookListing =' not in text:
              marker = "    var emailProductTitle = productTitle.replace(/[—–]/g, ' - ').replace(/\\s+/g, ' ').trim();\n"
              addition = marker + "    var isSarahBookListing = /^(?:SESB1|PID7|PID8|PID9|PID10|PID11|PID12|PID13|PID14|PID16|PID17|DID3|DID4)$/i.test(productCode);\n"
              if marker not in text:
                  raise SystemExit('Email product-title marker not found; no change made.')
              text = text.replace(marker, addition, 1)

          subtitle_line = "      lines.splice(3, 0, \"Subtitle: Jesus's Birth through the BIG BLUE EYES of Sarah the Baby Sheep !\");"
          if subtitle_line not in text:
              marker2 = "    ];\n\n    if (!isDigital) lines.push('My Shipping Address:');"
              replacement2 = "    ];\n\n    if (isSarahBookListing) {\n      lines.splice(3, 0, \"Subtitle: Jesus's Birth through the BIG BLUE EYES of Sarah the Baby Sheep !\");\n    }\n\n    if (!isDigital) lines.push('My Shipping Address:');"
              if marker2 not in text:
                  raise SystemExit('Prepared-email array marker not found; no change made.')
              text = text.replace(marker2, replacement2, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit prepared email subtitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "Include exact Sarah subtitle in order emails"
          git push
