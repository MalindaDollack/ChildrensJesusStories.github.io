name: Apply Store Titles And Subtitles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix store titles and subtitles
        shell: python
        run: |
          from pathlib import Path
          import re
          import html

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          subtitle = "Subtitle: Jesus's birth through the eyes of Sarah the baby sheep !"

          titles = {
              'SESB1': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Black and White Regular 20 lb Paper Special Sameritain's Purse Edition.",
              'PID8': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Laminated and Ribbon Tied Baby Book Edition.",
              'PID7': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Customizable Color Laminated and Ribbon Tied Baby Book Edition.",
              'PID11': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Staples Photo Book Edition. Shipping Included",
              'PID16': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Saddle Book Regular 20 lb Paper Edition.",
              'PID17': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV)Color Saddle Book Regular 28 lb Paper Edition.",
              'PID10': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Comb-Bound  Soft Cover Book Edition.",
              'PID13': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Comb-Bound  Jesus Loves You ! Art Pad Laminated Covers Card Stock Edition.",
              'PID9': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Comb-Bound Fully Laminated Soft Cover Edition.",
              'PID12': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Comb-Bound Laminated Covers Card Stock Coloring Book Edition.",
              'DID3': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Standard E-Book Edition.",
              'DID4': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Flip E-Book Edition.",
              'PID14': "Sarah the Baby Sheep: My Shepherd, Jesus's Birth. The Christmas Story. Luke 1-20 (NIV) Color Staples Photo Book Edition. Pick up at Local Staples",
          }

          product_code = re.compile(r'^\s*(SESB\d+|PID\d+|DID\d+)\s*—\s*', re.S)
          article_re = re.compile(r'<article\b[^>]*>.*?</article>', re.S)

          found_codes = []

          def patch_article(match):
              article = match.group(0)
              hm = re.search(r'<h3([^>]*)>(.*?)</h3>', article, flags=re.S)
              if not hm:
                  return article

              plain_heading = re.sub(r'<[^>]+>', '', hm.group(2))
              cm = product_code.match(plain_heading)
              if not cm:
                  return article

              code = cm.group(1)
              found_codes.append(code)
              attrs = hm.group(1)

              if code in titles:
                  safe_title = html.escape(titles[code], quote=False)
                  new_heading = f'<h3{attrs}>{code} — {safe_title}</h3>'
                  article = article[:hm.start()] + new_heading + article[hm.end():]

              # Add one visible subtitle directly below the product heading.
              # Remove any previous generated subtitle there first.
              heading_pattern = re.compile(
                  r'(<h3[^>]*>\s*' + re.escape(code) + r'\s*—.*?</h3>)'
                  r'\s*(?:<p class="isbn-product-subtitle">.*?</p>\s*)*',
                  re.S
              )
              article = heading_pattern.sub(
                  r'\1\n<p class="isbn-product-subtitle">' + html.escape(subtitle, quote=False) + '</p>\n',
                  article,
                  count=1
              )

              # For the 13 ISBN-title listings, keep the same title/subtitle inside
              # the hidden description as well. The title stays bold; subtitle is regular.
              if code in titles:
                  safe_title = html.escape(titles[code], quote=False)
                  block = (
                      '<div class="isbn-title-description">'
                      f'<p><strong>{safe_title}</strong></p>'
                      f'<p>{html.escape(subtitle, quote=False)}</p>'
                      '</div>'
                  )

                  if re.search(r'<div class="isbn-title-description">.*?</div>', article, flags=re.S):
                      article = re.sub(
                          r'<div class="isbn-title-description">.*?</div>',
                          block,
                          article,
                          count=1,
                          flags=re.S
                      )
                  elif code in {'PID11', 'PID14'} and '<!-- PID-STAPLES-NOTE-END -->' in article:
                      article = article.replace(
                          '<!-- PID-STAPLES-NOTE-END -->',
                          '<!-- PID-STAPLES-NOTE-END -->\n' + block,
                          1
                      )
                  elif '<div class="store-details" hidden>' in article:
                      article = article.replace(
                          '<div class="store-details" hidden>',
                          '<div class="store-details" hidden>\n' + block,
                          1
                      )

              return article

          text = article_re.sub(patch_article, text)

          missing_titles = [code for code in titles if code not in found_codes]
          if missing_titles:
              raise SystemExit('Missing expected product headings: ' + ', '.join(missing_titles))

          path.write_text(text, encoding='utf-8')
          print('Product subtitles normalized for:', ', '.join(found_codes))
          print('ISBN titles updated for:', ', '.join(titles))

      - name: Commit corrected store page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct store titles and add regular subtitles"
          git push
