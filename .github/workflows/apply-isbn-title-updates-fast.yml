name: Correct Sarah Luke Titles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  correct-titles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct Luke reference everywhere Sarah product titles are controlled
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path('index.html'),
              Path('script-enhancements.js'),
              Path('.github/workflows/apply-isbn-title-updates.yml'),
              Path('.github/workflows/fix-isbn-description-placement.yml'),
          ]

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new = text.replace('Luke 1-20 (NIV)', 'Luke 2: 1-20 (NIV)')
              new = new.replace('Luke 2:1-20 (NIV)', 'Luke 2: 1-20 (NIV)')
              new = new.replace('Luke 2: 1-20(NIV)', 'Luke 2: 1-20 (NIV)')
              new = new.replace('Luke 2: 1-20 (NIV)Color', 'Luke 2: 1-20 (NIV) Color')
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No incorrect Luke references found.')

          print('Corrected: ' + ', '.join(changed))

      - name: Commit exact Luke 2 title wording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script-enhancements.js .github/workflows/apply-isbn-title-updates.yml .github/workflows/fix-isbn-description-placement.yml
          git diff --cached --quiet && exit 0
          git commit -m "Use exact Luke 2: 1-20 (NIV) wording in Sarah titles"
          git push
