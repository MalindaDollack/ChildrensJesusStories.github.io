name: Keep Exact Sarah Product Wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-isbn-title-updates-fast.yml'

permissions:
  contents: write

jobs:
  update-email-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add exact Sarah subtitle to prepared order emails
        shell: python
        run: |
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          subtitle = "Subtitle: Jesus's Birth through the BIG BLUE EYES of Sarah the Baby Sheep !"
          if subtitle in text:
              print('Exact Sarah subtitle is already present in prepared-email logic.')
          else:
              old = """    var lines = [
      'Dear Malinda,',
      '',
      'I would like to order: ' + emailProductTitle,
      '',
      'My name:',
      'My email address:'
    ];

    if (!isDigital) lines.push('My Shipping Address:');
"""
              new = """    var isSarahBookListing = /^(?:SESB1|PID7|PID8|PID9|PID10|PID11|PID12|PID13|PID14|PID16|PID17|DID3|DID4)$/i.test(productCode);
    var lines = [
      'Dear Malinda,',
      '',
      'I would like to order: ' + emailProductTitle
    ];

    if (isSarahBookListing) {
      lines.push("Subtitle: Jesus's Birth through the BIG BLUE EYES of Sarah the Baby Sheep !");
    }

    lines.push(
      '',
      'My name:',
      'My email address:'
    );

    if (!isDigital) lines.push('My Shipping Address:');
"""
              if old not in text:
                  raise SystemExit('Prepared-email normalizer block was not found; no change made.')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit prepared email subtitle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "Include exact Sarah subtitle in order emails"
          git push
