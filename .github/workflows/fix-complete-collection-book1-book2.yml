name: Fix Complete Collection Book 1 and Book 2

on:
  push:
    paths:
      - '.github/workflows/fix-complete-collection-book1-book2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only Book 1 and Book 2 shelf title/subtitle text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old1 = '{name:"Sweet-Pea", title:"Sweet-Pea the Baby Sparrow: Do Not Be Afraid ! God Cares ! Even the feathers on your head are numbered.", subtitle:"God\'s Message of Caring told through the Eyes of Sweet-Pea the Baby Sparrow !", ref:"Matthew 10:29–31 NIV", img:"web-images/sweet-pea book cover for library.webp?v=1", release:"Coming November 1, 2026"}'
          new1 = '{name:"Sweet-Pea", title:"Sweet-Pea the baby Sparrow: Don\'t Be Afraid! God Cares! Even the Feathers on your head are all numbered. Matthew 10:29-31 (NIV)", subtitle:"God\'s Message of Caring told through the Eyes of Sweet-Pea the Baby Sparrow!", ref:"Matthew 10:29–31 NIV", img:"web-images/sweet-pea book cover for library.webp?v=1", release:"Coming November 1, 2026"}'

          old2 = '{name:"Sarah", title:"Sarah the Baby Sheep: My Shepherd, Jesus’s Birth, The Christmas Story", subtitle:"JESUS\'S birth through the eyes of Sarah the baby sheep !", ref:"Luke 2:1–20 NIV", img:"web-images/sarah book cover for library.webp?v=1", bookmark:"web-images/sarah-new.webp?v=1", release:"Available Now! • December 1, 2026", available:true}'
          new2 = '{name:"Sarah", title:"Sarah the Baby Sheep: My Shepherd, Jesus\'s Birth. The Christmas Story. Luke 1-20 (NIV)", subtitle:"Jesus\'s birth through the eyes of Sarah the baby sheep !", ref:"Luke 2:1–20 NIV", img:"web-images/sarah book cover for library.webp?v=1", bookmark:"web-images/sarah-new.webp?v=1", release:"Available Now! • December 1, 2026", available:true}'

          old_render = 'card.innerHTML=`<button class="cover-button" aria-label="Enlarge ${b.title}">${media}<span class="book-number">${i+1}</span></button><h3>${b.title}</h3><p class="reference">${b.ref}</p><p class="reference"><strong>${b.release}</strong></p>${seoDescription}${availability}`;'
          new_render = 'card.innerHTML=`<button class="cover-button" aria-label="Enlarge ${b.title}">${media}<span class="book-number">${i+1}</span></button><h3>${b.title}</h3>${b.subtitle?`<p class="reference">Subtitle: ${b.subtitle}</p>`:``}<p class="reference">${b.ref}</p><p class="reference"><strong>${b.release}</strong></p>${seoDescription}${availability}`;'

          for old, new, label in [(old1,new1,'Book 1'),(old2,new2,'Book 2'),(old_render,new_render,'shelf subtitle display')]:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit exact shelf text update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update Complete Collection Book 1 and Book 2 titles and subtitles"
          git push
