name: Reorder store sections

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-store-sections.yml

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put only Physical Items first
        run: |
          python3 -c "from pathlib import Path; import base64,re; p=Path('index.html'); s=p.read_text(encoding='utf-8'); x=base64.b64decode('').decode('utf-8'); pat=re.compile(r'<script id=\"store-section-order-fix\">.*?</script>',re.S); s=pat.sub(lambda m:x,s,count=1) if pat.search(s) else s.replace('</body>',x+'\\n</body>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit corrected section order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore Services and Digital layouts while keeping Physical Items first"
          git push
