name: Repair SO7 service artwork

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-store-sections.yml

permissions:
  contents: write

jobs:
  repair-so7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Switch only SO7 to coding services.png
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          pat = re.compile(
              r'(<article class="store-card" id="store-SO7">\s*<img[^>]*?src=")[^"]+("[^>]*>)',
              re.S
          )
          replacement = r'\1coding%20services.png?v=20261001d\2'
          s, count = pat.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('SO7 image tag was not found exactly once; no website change made.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SO7 picture repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use coding services image for SO7"
          git pull --rebase origin main
          git push origin main
