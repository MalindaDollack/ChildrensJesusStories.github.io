name: Repair Services and Digital layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-store-sections.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair only Services pictures and Digital Items card grid
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Give the Digital Items heading a stable hook without changing its text.
          old_heading = '<h2 class="special-store-heading">Digital Items</h2>'
          new_heading = '<h2 class="special-store-heading" id="digital-items-heading">Digital Items</h2>'
          if old_heading in s:
              s = s.replace(old_heading, new_heading, 1)

          # Force only the Digital Items cards back to the site's normal responsive card grid,
          # even if another store rule would otherwise make this grid a vertical list.
          style = '''<style id="services-digital-display-fix">
          #digital-items-heading + .store-intro + .store-grid{
            display:grid!important;
            grid-template-columns:repeat(auto-fit,minmax(245px,1fr))!important;
            gap:20px!important;
            width:min(1220px,96vw)!important;
            margin:24px auto!important;
            flex-direction:initial!important;
          }
          #services-offered .store-card > img{
            display:block!important;
            width:100%!important;
            height:250px!important;
            object-fit:contain!important;
            background:#fff!important;
            visibility:visible!important;
            opacity:1!important;
          }
          @media(max-width:560px){
            #services-offered .store-card > img{height:210px!important}
          }
          </style>'''
          style_pat = re.compile(r'<style id="services-digital-display-fix">.*?</style>', re.S)
          if style_pat.search(s):
              s = style_pat.sub(style, s, count=1)
          else:
              s = s.replace('</head>', style + '\n</head>', 1)

          # The service picture files are still present. Make just these seven pictures load
          # eagerly and refresh their URLs so older browsers do not keep a stale blank image.
          start = s.find('<section id="services-offered">')
          if start != -1:
              end = s.find('</section>', start)
              if end != -1:
                  end += len('</section>')
                  section = s[start:end]
                  section = section.replace('loading="lazy"', 'loading="eager"')
                  section = re.sub(r'(src="web-images/[^"]+?\.webp)\?v=\d+"', r'\1?v=20261001"', section)
                  s = s[:start] + section + s[end:]

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No repair change needed."
          else
            git commit -m "Fix Services pictures and restore Digital Items card grid"
            git push
          fi
