name: Repair SO7 service artwork

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-store-sections.yml

permissions:
  contents: write

jobs:
  repair-so7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install pillow

      - name: Convert the exact SO7 artwork to PNG and switch only SO7 to it
        run: |
          python3 <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          src = Path('web-images/so7-christian-digital-beginner-coding-services.webp')
          dst = Path('web-images/so7-christian-digital-beginner-coding-services.png')

          # Preserve the exact existing SO7 artwork, only changing the file format
          # to PNG for maximum compatibility with older browsers/computers.
          with Image.open(src) as im:
              im.convert('RGB').save(dst, 'PNG', optimize=True)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Change only the SO7 card image source. Do not alter any other service,
          # store card, game, price, description, email form, or layout.
          pat = re.compile(
              r'(<article class="store-card" id="store-SO7">\s*<img[^>]*?src=")web-images/so7-christian-digital-beginner-coding-services\.webp\?v=[^"]+("[^>]*>)',
              re.S
          )
          replacement = r'\1web-images/so7-christian-digital-beginner-coding-services.png?v=20261001b\2'
          s, count = pat.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('SO7 image tag was not found exactly once; no website change made.')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SO7 repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html web-images/so7-christian-digital-beginner-coding-services.png
          git commit -m "Fix SO7 service picture with PNG copy"
          git push
