name: Apply PID15 description fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pid15-description-fix.yml'

permissions:
  contents: write

jobs:
  update-pid15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add PID15 description paragraph
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          article_marker = '<article class="store-card portrait-product" id="store-PID15">'
          start = html.find(article_marker)
          if start == -1:
              raise SystemExit('PID15 article not found; no changes made.')
          end = html.find('</article>', start)
          if end == -1:
              raise SystemExit('PID15 article closing tag not found; no changes made.')

          block = html[start:end]
          if 'pid15-large-layout-note' in block:
              print('PID15 note already present; no change needed.')
              raise SystemExit(0)

          details_marker = '<p class="product-available">AVAILABLE</p><div class="store-details" hidden>'
          details_pos = block.find(details_marker)
          if details_pos == -1:
              raise SystemExit('PID15 description area not found; no changes made.')

          description_start = block.find('<p>', details_pos + len(details_marker))
          if description_start == -1:
              raise SystemExit('PID15 description paragraph not found; no changes made.')
          description_end = block.find('</p>', description_start)
          if description_end == -1:
              raise SystemExit('PID15 description paragraph closing tag not found; no changes made.')
          description_end += len('</p>')

          addition = '\n<div aria-hidden="true" style="height:14px;"></div>\n<p class="pid15-large-layout-note"><strong>Extremely Large</strong> Laminated Tile Area Lay-Out . Each tile is 5.5" X 4.25". They cover over <strong>5 feet</strong> when placed in a double matching row lay-out or over 2 Ft Square when placed in a 6 Tile lay-out.</p>'
          block = block[:description_end] + addition + block[description_end:]
          html = html[:start] + block + html[end:]
          path.write_text(html, encoding='utf-8')
          print('PID15 description note added directly to index.html.')
          PY
      - name: Commit PID15 description update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No website changes needed."
          else
            git commit -m "Add PID15 large tile layout description"
            git push origin main
          fi
