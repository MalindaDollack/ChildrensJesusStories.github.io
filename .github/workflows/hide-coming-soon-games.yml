name: Hide Coming Soon Character Games

on:
  push:
    paths:
      - '.github/workflows/hide-coming-soon-games.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep only Sarah and Sweet-Pea coming soon character games
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          labels = [
              'Matching Games for Each Book',
              'Sudoku Games for Each Book',
              'Find-A-Word Games for Each Book',
          ]

          for label in labels:
              pattern = re.compile(
                  r'(<div class="book-game-links" aria-label="' + re.escape(label) + r'">.*?<div class="book-game-links-list">)(.*?)(</div>\s*</div>)',
                  re.S
              )
              m = pattern.search(text)
              if not m:
                  raise SystemExit(f'Could not find game list: {label}')

              prefix, body, suffix = m.groups()
              anchors = re.findall(r'<a class="book-game-link[^>]*>.*?</a>', body, flags=re.S)
              if len(anchors) < 2:
                  raise SystemExit(f'Unexpected game link count in {label}: {len(anchors)}')

              kept = []
              for anchor in anchors:
                  if "Sarah's" in anchor:
                      anchor = anchor.replace('class="book-game-link sarah-ready"', 'class="book-game-link coming-soon"')
                      anchor = anchor.replace("Sarah's game link will be added here", 'Coming Soon')
                      kept.append(anchor)
                  elif "Sweet-Pea's" in anchor:
                      kept.append(anchor)

              if len(kept) != 2:
                  raise SystemExit(f'Expected Sarah and Sweet-Pea only in {label}; kept {len(kept)}')

              new_body = '\n' + '\n'.join(kept) + '\n'
              text = text[:m.start()] + prefix + new_body + suffix + text[m.end():]

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit game visibility change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide other coming soon character games"
          git push
