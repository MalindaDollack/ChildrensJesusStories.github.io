name: Render live public website

on:
  push:
    branches: ["verify-live-site-2026-09-23"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture live website
        run: npx -y playwright@1.55.0 screenshot --full-page --viewport-size="1440,900" "https://bigblueeyeschildrensbiblestories.com/?visualcheck=${GITHUB_RUN_ID}" live-site.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: live-site-screenshot
          path: live-site.png
          retention-days: 1
