name: Fix Sarah Subtitle and Preview

on:
  push:
    paths:
      - '.github/workflows/fix-sarah-subtitle-preview.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested Sarah fixes only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Complete Collection: capitalize Sheep in Book 2 subtitle.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_sub = 'subtitle:"Jesus\'s birth through the eyes of Sarah the baby sheep !"'
          new_sub = 'subtitle:"Jesus\'s birth through the eyes of Sarah the baby Sheep !"'
          if old_sub not in s:
              raise SystemExit('Book 2 subtitle text not found')
          s = s.replace(old_sub, new_sub, 1)

          # 2) Complete Collection: make Sarah picture open the same current DID3 Standard E-Book preview.
          old_click = "if(b.available){cover.addEventListener('click',openSarahPreview)}else if(b.img){cover.addEventListener('click',()=>openImage(b.img,b.title))}"
          new_click = "if(b.available){cover.addEventListener('click',()=>window.open('sarah-5-page-preview.html?v=31','_blank','noopener'))}else if(b.img){cover.addEventListener('click',()=>openImage(b.img,b.title))}"
          if old_click not in s:
              raise SystemExit('Sarah shelf picture click handler not found')
          s = s.replace(old_click, new_click, 1)
          p.write_text(s, encoding='utf-8')

          # Keep the same subtitle capitalization in the store subtitle updater.
          p2 = Path('script-enhancements.js')
          s2 = p2.read_text(encoding='utf-8')
          old_store_sub = 'const subtitle = "Jesus\'s birth through the eyes of Sarah the baby sheep !";'
          new_store_sub = 'const subtitle = "Jesus\'s birth through the eyes of Sarah the baby Sheep !";'
          if old_store_sub in s2:
              s2 = s2.replace(old_store_sub, new_store_sub, 1)
              p2.write_text(s2, encoding='utf-8')
          PY
      - name: Commit requested fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Sarah subtitle capitalization and shelf preview"
          git push
