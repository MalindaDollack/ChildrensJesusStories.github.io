name: Update Store Catalog

on:
  push:
    paths:
      - 'remove_pid15_main_caption.py'
      - '.github/workflows/update-store.yml'

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove PID15 main-picture caption
        run: python remove_pid15_main_caption.py
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No website changes needed."
          else
            git commit -m "Remove PID15 main picture caption"
            git push
          fi
