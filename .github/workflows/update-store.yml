name: Update Store Catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'add_pid16_17_frog_photo.py'
      - '.github/workflows/update-store.yml'

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add PID16 and PID17 frog photo
        run: python add_pid16_17_frog_photo.py
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No website changes needed."
          else
            git commit -m "Add missing saddle book photo to PID16 and PID17"
            git push
          fi
