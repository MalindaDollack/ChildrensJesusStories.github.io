name: Update Store Catalog

on:
  push:
    paths:
      - 'pid2_3_bookmarks_update.py'

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply PID2 and PID3 bookmark update
        run: python pid2_3_bookmarks_update.py
      - name: Commit updated website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No website changes needed."
          else
            git commit -m "Update PID2 and PID3 bookmark pictures"
            git push
          fi
