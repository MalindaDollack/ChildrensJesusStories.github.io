name: Apply bilingual Canadian SEO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-bilingual-seo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add bilingual Canadian SEO and product notices
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          html = html.replace('<html lang="en">', '<html lang="en-CA">', 1)

          old_desc = '<meta name="description" content="Discover children\'s Bible stories, Christian books and Bible activities for kids at Malinda\'s Story Garden, featuring Sarah the Baby Sheep and the Christmas story of Jesus\'s birth.">'
          new_desc = '<meta name="description" content="Canadian children\'s Bible stories, Christian books and Bible activities from Malinda\'s Story Garden. English products available now; Canadian French versions are coming soon. Site content is presented in English and Canadian French.">'
          if old_desc in html:
              html = html.replace(old_desc, new_desc, 1)

          old_title = '<title>Children\'s Bible Stories & Christian Books for Kids | Malinda\'s Story Garden</title>'
          new_title = '<title>English & Canadian French Children\'s Bible Stories | Malinda\'s Story Garden Canada</title>'
          if old_title in html:
              html = html.replace(old_title, new_title, 1)

          marker = '<!-- bilingual-canada-seo -->'
          if marker not in html:
              seo = '''\n  <!-- bilingual-canada-seo -->
  <link rel="canonical" href="https://bigblueeyeschildrensbiblestories.com/">
  <meta property="og:locale" content="en_CA">
  <meta property="og:locale:alternate" content="fr_CA">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Malinda's Story Garden">
  <meta property="og:title" content="English & Canadian French Children's Bible Stories | Malinda's Story Garden Canada">
  <meta property="og:description" content="Canadian children's Bible stories and Christian products. English versions are available now; Canadian French product versions are coming soon.">
  <meta property="og:url" content="https://bigblueeyeschildrensbiblestories.com/">
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@graph":[
      {
        "@type":"WebSite",
        "@id":"https://bigblueeyeschildrensbiblestories.com/#website",
        "url":"https://bigblueeyeschildrensbiblestories.com/",
        "name":"Malinda's Story Garden",
        "description":"Canadian children's Bible stories and Christian products in English, with Canadian French versions coming soon.",
        "inLanguage":["en-CA","fr-CA"]
      },
      {
        "@type":"Organization",
        "@id":"https://bigblueeyeschildrensbiblestories.com/#organization",
        "name":"Malinda's Story Garden",
        "url":"https://bigblueeyeschildrensbiblestories.com/",
        "areaServed":{"@type":"Country","name":"Canada"}
      }
    ]
  }
  </script>
'''
              html = html.replace('</head>', seo + '\n</head>', 1)

          index.write_text(html, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          js_marker = '// Canadian French product availability notices and language metadata.'
          if js_marker not in js:
              js += r'''

// Canadian French product availability notices and language metadata.
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.lang = 'en-CA';
  document.querySelectorAll('.fr-ca, .fr-ca-inline').forEach(el => el.setAttribute('lang','fr-CA'));

  const addFrenchComingSoon = card => {
    if (!card || card.querySelector('.fr-version-coming-soon')) return;
    const note = document.createElement('div');
    note.className = 'fr-version-coming-soon';
    note.setAttribute('role','note');
    note.style.cssText = 'margin:10px 0 8px;padding:9px 10px;border-radius:11px;background:#f8efff;border:2px solid #d9b3ee;color:#4b146f;text-align:center;font-weight:900;line-height:1.3';
    note.innerHTML = '<span>Canadian French Versions Coming Soon !</span><span lang="fr-CA" class="fr-ca" style="margin-top:4px">Versions canadiennes-françaises à venir !</span>';
    const order = card.querySelector('.store-order, .book-actions');
    if (order) order.insertAdjacentElement('beforebegin', note);
    else card.appendChild(note);
  };

  document.querySelectorAll('.store-card, .book-card').forEach(addFrenchComingSoon);

  const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => mutation.addedNodes.forEach(node => {
      if (!(node instanceof Element)) return;
      if (node.matches('.store-card, .book-card')) addFrenchComingSoon(node);
      node.querySelectorAll?.('.store-card, .book-card').forEach(addFrenchComingSoon);
      node.querySelectorAll?.('.fr-ca, .fr-ca-inline').forEach(el => el.setAttribute('lang','fr-CA'));
    }));
  });
  observer.observe(document.body, {childList:true, subtree:true});
});
'''
              script.write_text(js, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git commit -m 'Add Canadian bilingual SEO and French versions coming soon notices [skip ci]'
          git push origin main

# Triggered after creation so the website patch runs on main.
