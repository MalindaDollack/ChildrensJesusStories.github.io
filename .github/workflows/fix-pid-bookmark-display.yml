name: Fix bookmark pictures

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pid-bookmark-display.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix bookmark pictures directly
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove any older copy of this bookmark-only hotfix.
          s = re.sub(r'\n?<script id="win7-bookmark-inline-fix">.*?</script>\n?', '\n', s, flags=re.S)

          hotfix = r'''
<script id="win7-bookmark-inline-fix">
(function () {
  function fixBookmarkPictures() {
    var ids = ['store-PID1', 'store-PID2', 'store-PID3'];
    var i, j, card, pictures;
    for (i = 0; i < ids.length; i += 1) {
      card = document.getElementById(ids[i]);
      if (!card) { continue; }
      pictures = card.getElementsByTagName('img');
      for (j = 0; j < pictures.length; j += 1) {
        pictures[j].style.setProperty('width', '100%', 'important');
        pictures[j].style.setProperty('max-width', '250px', 'important');
        pictures[j].style.setProperty('height', '250px', 'important');
        pictures[j].style.setProperty('aspect-ratio', 'auto', 'important');
        pictures[j].style.setProperty('object-fit', 'contain', 'important');
        pictures[j].style.setProperty('object-position', 'center', 'important');
        pictures[j].style.setProperty('background', '#ffffff', 'important');
        pictures[j].style.setProperty('margin-left', 'auto', 'important');
        pictures[j].style.setProperty('margin-right', 'auto', 'important');
      }
    }
  }

  if (document.readyState === 'complete') {
    fixBookmarkPictures();
  } else if (window.addEventListener) {
    window.addEventListener('load', fixBookmarkPictures, false);
  } else if (window.attachEvent) {
    window.attachEvent('onload', fixBookmarkPictures);
  }
}());
</script>
'''

          if '</body>' not in s:
              raise SystemExit('Could not find closing body tag.')
          s = s.replace('</body>', hotfix + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit bookmark fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix PID1 PID2 PID3 bookmark picture sizing"
          git push
