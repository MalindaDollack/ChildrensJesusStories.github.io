name: Fix bookmark pictures

on:
  push:
    branches: [main]
    paths: [.github/workflows/fix-pid-bookmark-display.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bookmark sizing fix
        run: python3 -c "from pathlib import Path; import re,base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=re.sub(r'\\n?<script id=\\\"win7-bookmark-inline-fix\\\">.*?</script>\\n?', '\\n', s, flags=re.S); h=base64.b64decode('').decode('utf-8'); s=s.replace('</body>', h+'\\n</body>', 1); p.write_text(s, encoding='utf-8')"
      - name: Commit bookmark fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force PID1 PID2 PID3 bookmark image sizing"
          git push
