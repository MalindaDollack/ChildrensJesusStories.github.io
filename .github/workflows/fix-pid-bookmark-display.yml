name: Fix store pictures

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-pid-bookmark-display.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix live index
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('script.js?v=12','script.js?v=13'); s=s.replace('id=\"store-PID16\">\n<div class=\"product-gallery collapsible-gallery\"><img loading=\"lazy\" decoding=\"async\" src=\"saddle book main picture.jpg?v=1\"','id=\"store-PID16\">\n<div class=\"product-gallery collapsible-gallery\"><img loading=\"lazy\" decoding=\"async\" src=\"saddle book main 28 lbs.jpg?v=2\"'); s=s.replace('id=\"store-PID17\">\n<div class=\"product-gallery collapsible-gallery\"><img loading=\"lazy\" decoding=\"async\" src=\"saddle book main picture.jpg?v=1\"','id=\"store-PID17\">\n<div class=\"product-gallery collapsible-gallery\"><img loading=\"lazy\" decoding=\"async\" src=\"saddle book main 20lbs.jpg?v=2\"'); marker='</head>'; css='''<style id=\"win7-store-picture-fix\">#store-PID1 img,#store-PID2 img,#store-PID3 img,#store-PID16 img,#store-PID17 img{width:250px!important;max-width:100%!important;height:250px!important;object-fit:contain!important;object-position:center!important;background:#fff!important;margin-left:auto!important;margin-right:auto!important}</style>'''; s=s.replace(css,''); s=s.replace(marker,css+'\n'+marker,1); p.write_text(s,encoding='utf-8')"

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix bookmark and PID16 PID17 display"
          git push
