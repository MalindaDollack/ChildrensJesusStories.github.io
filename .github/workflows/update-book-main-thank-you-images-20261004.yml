name: Swap PID16 PID17 Main Pictures

on:
  push:
    paths:
      - '.github/workflows/update-book-main-thank-you-images-20261004.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap-pictures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Swap only PID16 and PID17 main pictures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')

          def set_main(card_id, src, alt):
              global html
              pat = re.compile(r'(<article\b[^>]*id="' + re.escape(card_id) + r'"[^>]*>.*?</article>)', re.S)
              m = pat.search(html)
              if not m:
                  raise SystemExit(f'Could not find {card_id}')
              block = m.group(1)
              img = re.search(r'<img\b[^>]*>', block)
              if not img:
                  raise SystemExit(f'Could not find main image in {card_id}')
              tag = img.group(0)
              if 'src="' in tag:
                  tag = re.sub(r'src="[^"]*"', f'src="{src}"', tag, count=1)
              else:
                  tag = tag[:-1] + f' src="{src}">'
              if 'alt="' in tag:
                  tag = re.sub(r'alt="[^"]*"', f'alt="{alt}"', tag, count=1)
              else:
                  tag = tag[:-1] + f' alt="{alt}">'
              block = block[:img.start()] + tag + block[img.end():]
              html = html[:m.start()] + block + html[m.end():]

          set_main('store-PID16', 'Thank You 20lb Saddle Book.jpg?v=20261005', 'Thank You 20lb Saddle Book')
          set_main('store-PID17', 'Thank You 28lb Saddle Book.jpg?v=20261005', 'Thank You 28lb Saddle Book')
          html_path.write_text(html, encoding='utf-8')

          js_path = Path('script-enhancements.js')
          js = js_path.read_text(encoding='utf-8')
          js = re.sub(
              r"\{ id: 'store-PID16', src: '[^']*', alt: '[^']*' \},",
              "{ id: 'store-PID16', src: 'Thank You 20lb Saddle Book.jpg?v=20261005', alt: 'Thank You 20lb Saddle Book' },",
              js,
              count=1
          )
          js = re.sub(
              r"\{ id: 'store-PID17', src: '[^']*', alt: '[^']*' \}",
              "{ id: 'store-PID17', src: 'Thank You 28lb Saddle Book.jpg?v=20261005', alt: 'Thank You 28lb Saddle Book' }",
              js,
              count=1
          )
          js_path.write_text(js, encoding='utf-8')
          PY

      - name: Commit picture swap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script-enhancements.js
          git diff --cached --quiet && exit 0
          git commit -m "Swap PID16 and PID17 main pictures"
          git push
