name: Verify bright live website

on:
  push:
    branches: ["verify-bright-site-2026-09-23"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture normal and forced-dark public site
        shell: bash
        run: |
          cat > /tmp/check.mjs <<'EOF'
          import { chromium } from "playwright";
          const url="https://bigblueeyeschildrensbiblestories.com/?brightverify="+Date.now();
          async function shot(name,args){
            const browser=await chromium.launch({headless:true,args});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            await page.goto(url,{waitUntil:"networkidle"});
            await page.screenshot({path:name,fullPage:true});
            const info=await page.evaluate(()=>({
              colorScheme:getComputedStyle(document.documentElement).colorScheme,
              bodyBg:getComputedStyle(document.body).backgroundColor,
              oldPopup:document.body.innerText.includes("E-mail Malinda Your Home Address"),
              did1:document.documentElement.innerHTML.includes("subject=DID1"),
              did4:document.documentElement.innerHTML.includes("subject=DID4"),
              lightMeta:!!document.querySelector('meta[name="color-scheme"][content="only light"],meta[name="color-scheme"][content="light only"]')
            }));
            console.log(name,JSON.stringify(info));
            if(info.oldPopup || !info.did1 || !info.did4 || !info.lightMeta) process.exitCode=1;
            await browser.close();
          }
          await shot("normal.png",[]);
          await shot("forced-dark.png",["--force-dark-mode","--enable-features=WebContentsForceDark"]);
          EOF
          npx -y -p playwright@1.55.0 node /tmp/check.mjs
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: bright-site-proof
          path: |
            normal.png
            forced-dark.png
          retention-days: 1
