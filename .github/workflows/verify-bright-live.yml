name: Verify bright live website

on:
  push:
    branches: ["verify-bright-site-2026-09-23"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Capture normal and forced-dark public site
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(find "$HOME/.cache/ms-playwright" -type f -path "*/chrome-linux/chrome" -perm -111 | head -1)"
          test -n "$chrome"
          url="https://bigblueeyeschildrensbiblestories.com/?brightverify=${GITHUB_RUN_ID}"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,2200 --screenshot=normal.png "$url"
          "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --force-dark-mode --enable-features=WebContentsForceDark --window-size=1440,2200 --screenshot=forced-dark.png "$url"
          test -s normal.png
          test -s forced-dark.png
          html="$(curl -fsSL -H 'Cache-Control: no-cache' "$url")"
          css="$(curl -fsSL -H 'Cache-Control: no-cache' "https://bigblueeyeschildrensbiblestories.com/styles.css?brightverify=${GITHUB_RUN_ID}")"
          ! grep -Fq 'E-mail Malinda Your Home Address' <<<"$html"
          grep -Eq '<meta name="color-scheme" content="(only light|light only)">' <<<"$html"
          grep -Fq 'subject=DID1' <<<"$html"
          grep -Fq 'subject=DID4' <<<"$html"
          grep -Eq 'color-scheme:(only light|light only)' <<<"$css"
      - name: Upload visual proof
        uses: actions/upload-artifact@v4
        with:
          name: bright-site-proof
          path: |
            normal.png
            forced-dark.png
          retention-days: 1
