<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Sarah the Baby Sheep | 5-Page Flip Book Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#f6ecfb;font-family:Arial,sans-serif;color:#351344;text-align:center}.wrap{max-width:980px;margin:auto;padding:18px}h1{color:#5a1678;font-size:clamp(22px,4vw,36px);margin:6px 0}.note{font-weight:700}.book{width:min(88vw,560px);aspect-ratio:6.5/9;margin:18px auto;perspective:1800px;position:relative}.sheet{position:absolute;inset:0;background:#fff;border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.28);transform-origin:left center;transition:transform .7s ease,opacity .15s .55s;backface-visibility:hidden;overflow:hidden}.sheet img{width:100%;height:100%;object-fit:contain;display:block}.sheet.turned{transform:rotateY(-180deg);opacity:0;pointer-events:none}.controls{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}.controls button,.buy,.photo{border:0;border-radius:999px;padding:12px 20px;font-weight:900;font-size:16px;cursor:pointer}.controls button,.buy{background:#6b218a;color:#fff}.buy{text-decoration:none;display:inline-block}.photo{background:#176b27;color:#fff;display:inline-block;margin-left:10px;text-decoration:none}.photo-link{display:inline-block;margin-left:10px;color:#5b197d;text-decoration:underline;font-weight:900;font-size:17px}.status{font-weight:900;color:#5a1678;min-width:110px}@media(max-width:600px){.wrap{padding:10px}.controls button{padding:10px 14px}.photo,.photo-link{display:block;margin:10px auto 0;width:max-content}}</style></head><body><div class="wrap"><h1>5-Page Flip Book E-Book Preview</h1><p class="note">Click Next or swipe left to turn the pages.</p><div class="book" id="book"><div class="sheet" data-page="1" style="z-index:5"><img src="1%20Standard%20e-book%20edition%20cover.png" alt="Standard E-Book cover"></div><div class="sheet" data-page="2" style="z-index:4"><img src="mastercopyright.png" alt="Copyright page"></div><div class="sheet" data-page="3" style="z-index:3"><img src="masterdedication.png" alt="Dedication page"></div><div class="sheet" data-page="4" style="z-index:2"><img src="masterpage1.png" alt="Story page 1"></div><div class="sheet" data-page="5" style="z-index:1"><img src="masterpage2.png" alt="Story page 2"></div></div><div class="controls"><button id="prev">◀ Previous</button><span class="status" id="status">Page 1 of 5</span><button id="next">Next ▶</button></div><a class="buy" href="mailto:dollackj316@gmail.com?subject=Order%20inquiry%3A%20Flip%20Book%20E-Book%20Edition%20Link&body=Hello%20Malinda%2C%0A%0AI%20would%20like%20-%20The%20Link%20to%20the%20Flip%20Book%20E-Book%20Edition%0A%0AMy%20name%3A%0AMy%20e-mail%20address%3A%0A%0APlease%20send%20me%20the%20e-Transfer%20instructions.%0A">Buy Now !</a><a class="photo" href="index.html#staples-book-card">Photo Book Edition Available Now !</a><a class="photo-link" href="index.html#staples-book-card">Buy Now !</a></div><script>const sheets=[...document.querySelectorAll('.sheet')],status=document.getElementById('status');let page=1;function render(){sheets.forEach((s,i)=>s.classList.toggle('turned',i<page-1));status.textContent='Page '+page+' of 5'}function next(){if(page<5){page++;render()}}function prev(){if(page>1){page--;render()}}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=prev;let x=0;const b=document.getElementById('book');b.addEventListener('touchstart',e=>x=e.changedTouches[0].clientX,{passive:true});b.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-x;if(d<-40)next();if(d>40)prev()},{passive:true});b.addEventListener('click',e=>{if(e.clientX>b.getBoundingClientRect().left+b.offsetWidth/2)next();else prev()});render();</script></body></html>
